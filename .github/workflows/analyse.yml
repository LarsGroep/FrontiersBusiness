name: Analyse (embeddings + MeSH areas + themes) for the Pi
# The Pi (1 GB RAM) is too small to embed ~30k papers next to its database, so this runner does the heavy work:
# it copies the catalogue (same source as the Pi's sync), runs pi/analysis.py against its own Postgres, and
# publishes the result tables as a release file. The Pi loads them with  bash /opt/herevidence/pi/import-analysis.sh

on:
  push:
    branches: [main]
    paths: ["pi/analysis.py", "pi/schema_analysis.sql"]
  workflow_dispatch:
    inputs:
      themes:
        description: "Number of broad themes (k)"
        default: "30"

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: analyse
          POSTGRES_DB: herdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash   # = bash -eo pipefail: a failing command before "| tail" fails the step
    env:
      PI_DB_URL: postgresql://postgres:analyse@localhost:5432/herdb
      PI_MODEL_DIR: /home/runner/.cache/herevidence-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding model + MeSH
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/herevidence-models
          key: herevidence-models-bge-small-mesh-v1

      - run: pip install -r requirements.txt -r pi/requirements.txt -r pi/requirements-analysis.txt

      - name: pgvector + catalogue copy
        env:
          # With these two repository secrets set, the catalogue comes from the Pi (source of truth, incl. papers
          # only the Pi has scraped); without them it falls back to Supabase.
          PI_CATALOGUE_URL: ${{ secrets.PI_API_URL && format('{0}/catalogue', secrets.PI_API_URL) || '' }}
          PI_API_TOKEN: ${{ secrets.PI_API_TOKEN }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -qc "create extension if not exists vector"
          python -m pi.sync catalogue | tail -3
          # Never publish an analysis of a truncated catalogue (it would replace the good one on the Pi).
          n=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -Atc "select count(*) from papers")
          echo "catalogue rows: $n"
          [ "$n" -ge 20000 ] || { echo "::error::catalogue has only $n papers; stopping"; exit 1; }

      - name: Reuse stored vectors (only new papers get embedded)
        env:
          PI_VECTORS_URL: ${{ secrets.PI_API_URL && format('{0}/vectors', secrets.PI_API_URL) || '' }}
          PI_API_TOKEN: ${{ secrets.PI_API_TOKEN }}
        run: |
          if [ -n "$PI_VECTORS_URL" ] && [ -n "$PI_API_TOKEN" ]; then
            python -m pi.sync vectors | tail -3          # from the Pi (source of truth)
          else
            # fallback: the last published release
            curl -fsSL -o prev.dump https://github.com/${{ github.repository }}/releases/download/analysis-latest/analysis.dump || exit 0
            docker cp prev.dump ${{ job.services.postgres.id }}:/tmp/prev.dump
            docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d herdb -q -f - < pi/schema_analysis.sql
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -qc "create table prev_vec (like paper_vec)"
            docker exec ${{ job.services.postgres.id }} pg_restore --data-only -t paper_vec -f /tmp/prev.sql /tmp/prev.dump
            docker exec ${{ job.services.postgres.id }} sed -i 's/^COPY public.paper_vec /COPY public.prev_vec /' /tmp/prev.sql
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -q -f /tmp/prev.sql
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -Atc \
              "insert into paper_vec select v.* from prev_vec v join papers p on p.id = v.paper_id on conflict do nothing; drop table prev_vec"
          fi
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d herdb -Atc "select 'reused vectors: '||count(*) from paper_vec"

      - name: MeSH areas, embeddings, themes
        run: |
          python -m pi.analysis all --k "${{ github.event.inputs.themes || '30' }}" --threads 4
          python -m pi.analysis summary > analysis-out-summary.txt
          python -m pi.analysis export --out analysis-out
          cp analysis-out-summary.txt analysis-out/summary.txt
          head -80 analysis-out/summary.txt

      - name: Dump the analysis tables
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d herdb -Fc --data-only \
            -t paper_vec -t mesh -t paper_area -t paper_symptom -t clusters -t paper_cluster -f /tmp/analysis.dump
          docker cp ${{ job.services.postgres.id }}:/tmp/analysis.dump analysis-out/analysis.dump
          ls -lh analysis-out

      - name: Publish as release "analysis-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view analysis-latest >/dev/null 2>&1 || \
            gh release create analysis-latest --title "Analysis tables (latest)" \
              --notes "Embeddings, MeSH disease areas and theme clusters for the Pi. Load with pi/import-analysis.sh."
          gh release upload analysis-latest analysis-out/analysis.dump analysis-out/clusters.json analysis-out/summary.txt --clobber
