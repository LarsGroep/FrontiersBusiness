<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Themes</title>
<style>
/* ---- shared theme: this block is identical on every page ---- */
:root{
  --paper:#FCF4F3; --surface:#FFFFFF; --tint:#F7E8E7;
  --ink:#2B1A1E; --ink-2:#523A40; --muted:#765C62;
  --rule:#EFD9D8; --rule-strong:#D5ABAE; --field:#A8757C;
  --accent:#B03A56; --accent-strong:#8F2A44; --accent-soft:#F9E1E4; --on-accent:#FFFFFF;
  --teal:#2A6F73; --teal-soft:#DFEEED; --heart:#B03A56; --heart-soft:#F9E1E4;
  --marker:#FFE08A; --marker-ink:#2B1A1E;
  --warn:#7A4A00; --warn-line:#C77700; --warn-soft:#FFF0C2;
  --focus:#1F5FD1; --edge:#D5ABAE; --hl:#E0A100;
  --shadow:0 1px 2px rgba(92,38,50,.06),0 4px 14px rgba(92,38,50,.05);
  --radius-s:6px; --radius-m:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836; --heart:#F08FA6; --heart-soft:#45222D;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --edge:#5A4047; --hl:#F5C451; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836; --heart:#F08FA6; --heart-soft:#45222D;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --edge:#5A4047; --hl:#F5C451; --shadow:none;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:inherit;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
a:hover{color:var(--accent-strong);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button,input,select,textarea{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],input:not([type]),select,textarea{
  padding:10px 12px;border:1px solid var(--field);border-radius:var(--radius-m);background:var(--surface);color:var(--ink);max-width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
.btn{border:1px solid transparent;border-radius:var(--radius-m);padding:10px 18px;min-height:44px;font-weight:600;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.55;cursor:default}
.btn.quiet{background:var(--surface);color:var(--accent-strong);border-color:var(--rule-strong)}
.btn.quiet:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.sitenav{background:var(--surface);border-bottom:1px solid var(--rule)}
.sitenav > div{max-width:var(--page,1180px);margin:0 auto;padding:8px 4px;display:flex;flex-wrap:wrap;gap:4px}
.sitenav a{padding:7px 12px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink-2);text-decoration:none}
.sitenav a:hover{background:var(--tint);color:var(--ink)}
.sitenav a[aria-current]{background:var(--accent-soft);color:var(--accent-strong)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- end shared theme ---- */
:root{--page:1240px}
.wrap{max-width:var(--page);margin:0 auto;padding:0 16px}
header{padding:14px 0 0}
.stats{color:var(--muted);font-size:14px;margin:0}
.stats b{color:var(--ink)}
.focusbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:14px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.focusbar label{font-weight:600}
.btn{padding:8px 14px;min-height:40px}
.areanote{color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;padding:20px 0 60px}
.themes{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.themes li button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
.themes li:last-child button{border-bottom:0}
.themes li button:hover{background:var(--paper)}
.themes li button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.themes li button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.tl{font-weight:600;font-size:14.5px;line-height:1.35}
.tm{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--field);border-radius:3px}
.bar i.hl{background:var(--accent)}
.hlnum{color:var(--accent-strong);font-weight:700}
h2{font-size:26px;margin:0 0 4px;line-height:1.25}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-strong);border-radius:999px;padding:3px 11px;font-size:13px;background:var(--surface);color:var(--ink-2)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
button.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.chip.heart{border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.searchrow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.searchrow input{flex:1 1 220px;min-width:0}
.count{color:var(--muted);font-size:14px;margin:10px 0}
.papers{list-style:none;margin:0;padding:0}
.papers > li{padding:14px 0;border-top:1px solid var(--rule)}
.pt{font-weight:600;overflow-wrap:anywhere}
.pm{font-size:13px;color:var(--muted);margin-top:2px}
.pm .tag{display:inline-block;padding:0 8px;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink-2);font-size:12px}
.snip{font-size:14px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.snip mark{background:var(--marker);color:var(--marker-ink);padding:0 1px;border-radius:2px}
.link{background:none;border:0;padding:4px 0;color:var(--accent-strong);font-size:13px;font-weight:600;cursor:pointer;margin-top:2px;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.sim{margin:6px 0 0 14px;padding-left:12px;border-left:2px solid var(--rule-strong);font-size:13px}
.sim li{margin:3px 0}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.empty,.err{color:var(--muted);padding:20px 0}
.err{color:var(--warn)}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-m);box-shadow:var(--shadow);padding:12px 14px}
.kpi b{display:block;font:600 24px var(--serif);font-variant-numeric:tabular-nums;color:var(--accent-strong)}
.kpi span{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.layout{grid-template-columns:1fr}.themes{max-height:46vh;overflow:auto}.focusbar select{width:100%}}
</style>
</head>
<body>
<nav class="sitenav" aria-label="Site"><div><a href="/">Search</a><a href="/themes.html" aria-current="page">Themes</a><a href="/chat">Ask the research</a></div></nav>
<div class="wrap">
  <header>
    <p class="stats" id="stats">Loading themes…</p>
  </header>

  <div class="focusbar">
    <label for="area">Disease area</label>
    <select id="area"></select>
    <span class="areanote" id="areanote"></span>
  </div>

  <div class="layout">
    <section aria-label="Themes">
      <ul class="themes" id="themes"></ul>
    </section>
    <section id="detail" aria-live="polite"></section>
  </div>
</div>

<script>
const API = "/api/fulltext";
const DEFAULT_AREA = "C14 Cardiovascular Diseases";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nice = (a) => a.replace(/^[A-Z]\d\d /, "");
const fmt = (n) => Number(n || 0).toLocaleString("en-GB");

let data = null;
const state = { area: DEFAULT_AREA, theme: null, sub: null, q: "", page: 1 };

async function get(params) {
  const r = await fetch(API + "?" + new URLSearchParams(params));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error === "fulltext_offline" ? "The study server is offline or busy; try again in a moment." : (j.error || r.status));
  return j;
}

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("area")) state.area = h.get("area");
  state.theme = h.get("theme") ? +h.get("theme") : null;
  state.sub = h.get("sub") ? +h.get("sub") : null;
  state.q = h.get("q") || "";
}
function writeHash() {
  const h = new URLSearchParams();
  if (state.area !== DEFAULT_AREA) h.set("area", state.area);
  if (state.theme) h.set("theme", state.theme);
  if (state.sub) h.set("sub", state.sub);
  if (state.q) h.set("q", state.q);
  history.replaceState(null, "", h.toString() ? "#" + h : location.pathname);
}

// How many studies of the chosen disease area sit in a theme.
const areaIn = (t) => (state.area ? (t.area_counts ? t.area_counts[state.area] : (t.areas.find((a) => a.area === state.area) || {}).n) || 0 : 0);

function renderAreas() {
  const sel = $("#area");
  sel.innerHTML = `<option value="">All areas</option>` + data.areas
    .map((a) => `<option value="${esc(a.area)}">${esc(nice(a.area))} (${fmt(a.verified)})</option>`).join("");
  sel.value = state.area;
  const a = data.areas.find((x) => x.area === state.area);
  $("#areanote").textContent = a
    ? `${fmt(a.verified)} verified women-only studies (${fmt(a.n)} incl. probable) · ${(100 * a.verified / data.totals.verified).toFixed(1)}% of the dataset`
    : "";
}

function renderThemes() {
  const list = [...data.themes];
  const max = Math.max(...list.map((t) => t.size));
  if (state.area) list.sort((a, b) => areaIn(b) - areaIn(a) || b.size - a.size);
  $("#themes").innerHTML = list.map((t) => {
    const n = areaIn(t);
    return `<li><button aria-pressed="${t.id === state.theme}" data-id="${t.id}">
      <div class="tl">${esc(t.label)}</div>
      <div class="tm"><span>${fmt(t.size)}</span>
        <span class="bar"><i style="width:${(100 * t.size / max).toFixed(1)}%"></i>${state.area ? `<i class="hl" style="width:${(100 * n / max).toFixed(1)}%"></i>` : ""}</span>
        ${state.area ? `<span class="hlnum" title="${esc(nice(state.area))} studies in this theme">${n ? fmt(n) : "–"}</span>` : ""}
      </div></button></li>`;
  }).join("");
}

function chipList(items, key, cls = "") {
  return items.length ? `<div class="chips">${items.map((x) => `<span class="chip ${cls}">${esc(x[key])} · ${fmt(x.n)}</span>`).join("")}</div>` : `<span class="areanote">none</span>`;
}

function renderDetail() {
  const el = $("#detail");
  const t = data.themes.find((x) => x.id === state.theme);
  let head;
  if (!t) {
    const a = data.areas.find((x) => x.area === state.area);
    const inThemes = data.themes.filter((x) => areaIn(x) > 0).length;
    head = state.area ? `<h2>${esc(nice(state.area))}</h2>
      <div class="overview">
        <div class="kpi"><b>${fmt(a?.verified)}</b><span>verified women-only studies</span></div>
        <div class="kpi"><b>${fmt(a?.n)}</b><span>incl. probable</span></div>
        <div class="kpi"><b>${inThemes}</b><span>of ${data.themes.length} themes include it</span></div>
      </div>
      <p class="areanote">Pick a theme on the left to narrow down, or search within this area.</p>`
      : `<h2>All studies</h2><p class="areanote">Pick a disease area or a theme.</p>`;
  } else {
    head = `<h2>${esc(t.label)}</h2>
      <p class="areanote">${fmt(t.size)} studies${t.years?.min ? ` · ${t.years.min}–${t.years.max} (median ${t.years.median})` : ""}</p>
      <h3>Sub-themes</h3><div class="chips">${t.children.map((c) =>
        `<button class="chip" aria-pressed="${c.id === state.sub}" data-sub="${c.id}">${esc(c.label)} · ${fmt(c.size)}</button>`).join("")}</div>
      <h3>Disease areas</h3>${chipList(t.areas.map((a) => ({...a, area: nice(a.area)})), "area")}
      <h3>Symptoms (MeSH)</h3>${chipList(t.symptoms, "symptom", "heart")}
      <h3>Distinctive MeSH terms</h3><div class="chips">${t.top_mesh.map((m) => `<span class="chip">${esc(m.term)} · ${Math.round(m.share * 100)}%</span>`).join("")}</div>`;
  }
  const scope = [t ? (state.sub ? "this sub-theme" : "this theme") : "", state.area ? nice(state.area) : ""].filter(Boolean).join(" · ");
  el.innerHTML = head + (state.area || t ? `
    <form class="searchrow" id="sform"><input type="search" id="q" placeholder="Search within ${esc(scope)}" value="${esc(state.q)}">
    <button class="btn">Search</button>${state.q ? `<button type="button" class="btn quiet" id="clearq">Clear</button>` : ""}</form>
    <div id="results"><p class="count">Loading studies…</p></div>` : "");
  if (state.area || t) loadPapers();
}

function paperItem(r) {
  const meta = [r.journal, r.pub_year, r.n_female ? `${fmt(r.n_female)} women` : "", r.study_type].filter(Boolean).map(esc).join(" · ");
  const label = r.label === "female_only_verified" ? "" : ` <span class="tag">probable</span>`;
  const snip = (r.passages || []).slice(0, 1).map((p) => `<div class="snip">${p.snippet}</div>`).join("");
  const url = r.source_url || (r.pmcid ? `https://europepmc.org/article/PMC/${r.pmcid.replace(/^PMC/, "")}` : "#");
  return `<li><div class="pt"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
    <div class="pm">${meta}${label}</div>${snip}
    <button class="link" data-similar="${esc(r.paper_id)}">Similar studies</button><div class="simbox"></div></li>`;
}

async function loadPapers() {
  const box = $("#results");
  const cluster = state.sub || state.theme || "";
  const params = { per_page: 20, page: state.page };
  if (state.area) params.area = state.area;
  if (cluster) params.cluster = cluster;
  let j;
  try {
    if (state.q) j = await get({ ...params, q: state.q });
    else if (cluster && !state.area) j = await get({ cluster_id: cluster, page: state.page, per_page: 20 });
    else j = await get({ ...params, browse: 1 });
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const total = j.total ?? j.size ?? 0;
  const pages = Math.max(1, Math.ceil(total / 20));
  box.innerHTML = `<p class="count">${fmt(total)} studies${state.q ? ` matching “${esc(state.q)}”` : ""}${state.q ? "" : cluster && !state.area ? " · most typical first" : " · newest first"}</p>
    ${j.results.length ? `<ul class="papers">${j.results.map(paperItem).join("")}</ul>` : `<p class="empty">No studies here.</p>`}
    ${pages > 1 ? `<div class="pager"><button class="btn quiet" id="prev" ${state.page <= 1 ? "disabled" : ""}>Previous</button>
      <span class="areanote">Page ${state.page} of ${fmt(pages)}</span>
      <button class="btn quiet" id="next" ${state.page >= pages ? "disabled" : ""}>Next</button></div>` : ""}`;
}

async function showSimilar(btn) {
  const box = btn.nextElementSibling;
  if (box.innerHTML) { box.innerHTML = ""; return; }
  box.innerHTML = `<p class="areanote">Loading…</p>`;
  try {
    const j = await get({ similar: btn.dataset.similar });
    box.innerHTML = `<ul class="sim">${j.results.slice(0, 6).map((r) => `<li><a href="${esc(r.source_url || "#")}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="areanote">· ${r.pub_year ?? ""} · ${(r.similarity * 100).toFixed(0)}% similar</span></li>`).join("")}</ul>`;
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

function rerender(full = true) { writeHash(); if (full) { renderAreas(); renderThemes(); } renderDetail(); }

document.addEventListener("click", (e) => {
  const th = e.target.closest("#themes button");
  if (th) { const id = +th.dataset.id; state.theme = state.theme === id ? null : id; state.sub = null; state.page = 1; return rerender(); }
  const sb = e.target.closest("[data-sub]");
  if (sb) { const id = +sb.dataset.sub; state.sub = state.sub === id ? null : id; state.page = 1; return rerender(false); }
  const sim = e.target.closest("[data-similar]");
  if (sim) return showSimilar(sim);
  if (e.target.id === "prev") { state.page--; loadPapers(); scrollTo({ top: 0 }); }
  if (e.target.id === "next") { state.page++; loadPapers(); scrollTo({ top: 0 }); }
  if (e.target.id === "clearq") { state.q = ""; state.page = 1; rerender(false); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "sform") return;
  e.preventDefault(); state.q = $("#q").value.trim(); state.page = 1; writeHash(); loadPapers();
});
$("#area").addEventListener("change", (e) => { state.area = e.target.value; state.page = 1; rerender(); });

(async () => {
  readHash();
  try { data = await get({ clusters: 1 }); }
  catch (e) { $("#stats").textContent = e.message; return; }
  const t = data.totals || {};
  $("#stats").innerHTML = `<b>${fmt(data.themes.reduce((s, x) => s + x.size, 0))}</b> women-only studies in <b>${data.themes.length}</b> themes, grouped by what they are about.`;
  if (state.area && !data.areas.some((a) => a.area === state.area)) state.area = "";
  rerender();
})();
</script>
</body>
</html>
