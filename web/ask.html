<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask the evidence · Anarcha AI</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#FCF4F3; --surface:#FFFFFF; --tint:#F7E8E7;
  --ink:#2B1A1E; --ink-2:#523A40; --muted:#765C62;
  --rule:#EFD9D8; --rule-strong:#D5ABAE; --field:#A8757C;
  --accent:#B03A56; --accent-strong:#8F2A44; --accent-soft:#F9E1E4; --on-accent:#FFFFFF;
  --teal:#2A6F73; --teal-soft:#DFEEED;
  --marker:#FFE08A; --marker-ink:#2B1A1E;
  --warn:#7A4A00; --warn-line:#C77700; --warn-soft:#FFF0C2;
  --focus:#1F5FD1; --dot:#D9CBCB;
  --shadow:0 1px 2px rgba(92,38,50,.06),0 4px 14px rgba(92,38,50,.05);
  --radius-s:6px; --radius-m:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --dot:#4A3740; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --dot:#4A3740; --shadow:none;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:inherit;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
a:hover{color:var(--accent-strong);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
.btn{border:1px solid transparent;border-radius:var(--radius-m);padding:10px 18px;min-height:44px;font-weight:600;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-strong)}
.btn.quiet{background:var(--surface);color:var(--accent-strong);border-color:var(--rule-strong);min-height:0;padding:5px 12px;font-size:13px}
.btn.quiet:hover{background:var(--accent-soft);border-color:var(--accent)}
.sitenav{background:var(--surface);border-bottom:1px solid var(--rule)}
.sitenav > div{max-width:1180px;margin:0 auto;padding:8px 4px;display:flex;flex-wrap:wrap;gap:4px}
.sitenav a{padding:7px 12px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink-2);text-decoration:none}
.sitenav a:hover{background:var(--tint);color:var(--ink)}
.sitenav a[aria-current]{background:var(--accent-soft);color:var(--accent-strong)}

.wrap{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.hero{display:grid;gap:14px;text-align:center;justify-items:center}
.hero h1{margin:0;font-size:clamp(28px,5vw,42px);line-height:1.1}
.hero p{margin:0;color:var(--ink-2);font-size:18px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live{color:var(--teal);border-color:var(--teal)}
.status.live i{background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
form.ask{display:flex;gap:8px;width:100%;max-width:760px}
form.ask input{flex:1;min-width:0;padding:14px 18px;border:1.5px solid var(--field);border-radius:999px;background:var(--surface);font-size:18px}
form.ask input:hover,form.ask input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:999px;padding:0 24px;min-height:52px;font-weight:700;font-size:17px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:hover{background:var(--accent-strong)}
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:900px}
.person{display:grid;justify-items:center;gap:4px;padding:14px 10px 12px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.person:hover{transform:translateY(-2px);border-color:var(--accent)}
.person svg{width:38px;height:38px;color:var(--accent)}
.person .age{font-size:12px;font-weight:700;color:var(--accent-strong);background:var(--accent-soft);padding:1px 9px;border-radius:999px}
.person .who{font-size:13.5px;color:var(--ink-2);line-height:1.3;text-align:center}

/* the three-step story */
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.said{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2)}
.down{color:var(--rule-strong);font-size:18px;line-height:1;margin:6px 0}
.step{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:grid;gap:12px;align-content:start;min-width:0;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.step.on{opacity:1;transform:none}
.step:nth-child(2){transition-delay:.25s}.step:nth-child(3){transition-delay:.5s}
.step h2{margin:0;display:flex;align-items:center;gap:10px;font-size:19px}
.step h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 14px var(--sans)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.pill.ctx{background:var(--teal-soft);color:var(--teal)}
.pill.neg{background:var(--tint);color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted)}
.path{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.path li{display:flex;align-items:center;gap:8px;font-size:15px}
.path .q{flex:1}
.yn{font-size:12px;font-weight:800;letter-spacing:.03em;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.yn.no{background:var(--tint);color:var(--muted)}
.arrow{color:var(--rule-strong);text-align:center;font-size:18px;line-height:1;margin:-2px 0}
.dest{border-radius:12px;background:var(--accent-soft);padding:12px 14px;display:grid;gap:8px}
.dest b{font-family:var(--serif);font-size:21px;color:var(--accent-strong);line-height:1.2}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.split span{display:block;height:100%}
.splitkey{display:grid;gap:3px;font-size:13px;color:var(--ink-2)}
.splitkey span{display:flex;align-items:center;gap:6px}
.splitkey i{width:10px;height:10px;border-radius:3px;flex:none}
.big{font-family:var(--serif);font-size:46px;line-height:1;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.big small{display:block;font:600 14px var(--sans);color:var(--muted);margin-top:4px}
canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:12px;background:var(--paper)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.gap{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn-line)}

/* the studies */
.studies h2{margin:0 0 4px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.cards li{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0;overflow-wrap:anywhere}
.cards .top{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font:700 13px var(--sans)}
.ptitle{font-weight:600;line-height:1.35;font-size:15px}
.ptitle a{color:var(--ink);text-decoration:none}
.ptitle a:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink-2)}
.tag.live{background:var(--teal-soft);color:var(--teal)}
.quote{font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--ink-2);margin:0;padding-left:12px;border-left:3px solid var(--accent)}
mark{background:var(--marker);color:var(--marker-ink);border-radius:2px;padding:0 2px}
.more{justify-self:start;font-size:13px;font-weight:600;border:1px solid var(--rule-strong);background:var(--surface);color:var(--accent-strong);border-radius:999px;padding:4px 12px;cursor:pointer}
.more:hover{background:var(--accent-soft)}
.similar{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.foot{text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
.foot b{color:var(--ink-2)}
@media (max-width:860px){.story{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){form.ask{flex-direction:column}.btn{min-height:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.step{opacity:1;transform:none}}
</style>
</head>
<body>
<nav class="sitenav" aria-label="Site"><div><a href="/search">Search</a><a href="/themes.html">Themes</a><a href="/ask" aria-current="page">Ask the evidence</a><a href="/chat">Ask the research</a></div></nav>
<main class="wrap">
  <section class="hero">
    <span class="status" id="status"><i></i><span id="statustext">Loading</span></span>
    <h1>What does research on women say?</h1>
    <p>Describe her symptoms in everyday words.</p>
    <form class="ask" id="ask" role="search">
      <input id="q" type="search" autocomplete="off" placeholder="e.g. 58, jaw ache, feeling sick" aria-label="Her symptoms">
      <button class="btn" type="submit">Ask</button>
    </form>
    <div class="people" id="examples" aria-label="Examples"></div>
  </section>

  <div id="out" hidden>
    <div class="story">
      <section class="step" aria-labelledby="h1s"><h2 id="h1s"><span class="n">1</span>We heard</h2><div id="heard"></div></section>
      <section class="step" aria-labelledby="h2s"><h2 id="h2s"><span class="n">2</span>Where it points</h2><div id="tree"></div></section>
      <section class="step" aria-labelledby="h3s"><h2 id="h3s"><span class="n">3</span>Studies in women</h2><div id="summary"></div>
        <canvas id="map" width="600" height="600" aria-label="Every dot is a heart study in women; highlighted dots match her symptoms"></canvas>
        <div class="key"><span><i style="background:var(--dot)"></i>every study</span><span><i style="background:var(--accent)"></i>matches</span><span><i style="background:var(--teal)"></i>best 10</span></div>
      </section>
    </div>
    <section class="studies" style="margin-top:22px" aria-labelledby="h-stu">
      <h2 id="h-stu">What the studies say <span class="tag" id="livestate" hidden></span></h2>
      <ol class="cards" id="studies"></ol>
    </section>
  </div>
  <p class="foot"><b>Information, not a diagnosis.</b> Emergency: call 112.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NEG = /\b(no|not|without|absence of|denies|denied|free of|negative for)\b/i;
const EXAMPLES = [
  ["58", "Jaw ache, feeling sick", "58-year-old woman, jaw ache and feeling sick while gardening"],
  ["34 wk", "Pregnant, swollen ankles, headache", "34 weeks pregnant, swollen ankles and headache"],
  ["51", "Racing heart, dizzy, menopause", "51-year-old, palpitations and dizziness during menopause"],
  ["3 mo", "Out of breath, exhausted after birth", "out of breath and exhausted, 3 months after giving birth"]];
const CTX_RULES = [
  ["Pregnancy", /pregnan|gestation|trimester|\b\d{1,2}\s?(wk|wks|weeks)\b(?![^,.]*(postnatal|postpartum|after))/i],
  ["Postpartum", /postpartum|postnatal|post-natal|after (giving )?birth|had (a |her )?baby|after delivery|puerper|months? after/i],
  ["Menopause", /menopaus|hot flush|hot flash/i],
];
let G, T, M, lexRx, byId = {}, mapIdx = {}, live = false, liveCount = 0, lastRun = 0;

// ---------- load the precomputed evidence, then check the Pi
Promise.all(["/graph/cv.json", "/graph/tree-cv.json", "/graph/papers-cv.json"].map(u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null)))
  .then(([g, t, m]) => {
    if (!g) { $("statustext").textContent = "The evidence data could not be loaded."; return; }
    G = g; T = t; M = m;
    G.nodes.forEach(n => byId[n.id] = n);
    if (M) M.papers.forEach((p, i) => mapIdx[p[0]] = i);
    const terms = Object.keys(G.lexicon).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    lexRx = new RegExp("\\b(" + terms.join("|") + ")\\b", "gi");
    setStatus();
    EXAMPLES.forEach(([badge, label, q]) => { const b = document.createElement("button"); b.type = "button"; b.className = "person";
      b.innerHTML = `${PERSON_SVG}<span class="age">${esc(badge)}</span><span class="who">${esc(label)}</span>`;
      b.onclick = () => { $("q").value = q; run(q); }; $("examples").appendChild(b); });
    checkPi();
  });

function setStatus() {
  $("status").classList.toggle("live", live);
  $("statustext").textContent = live ? "Live" : "Offline";
  $("status").title = live ? `Connected to our server: ${liveCount.toLocaleString()} studies, full text` : "Works without our server, from a saved copy";
}
function timeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
async function checkPi() {
  try {
    const r = await fetch("/api/fulltext?health=1", { signal: timeout(3500), cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    live = !!(j && j.ok); liveCount = j && j.papers || 0;
  } catch (e) { live = false; }
  setStatus();
  if (lastRun && live) run($("q").value);          // the Pi came online: enrich the current answer
}
setInterval(checkPi, 60000);                         // picks up the Pi being plugged in or out during a demo

$("ask").onsubmit = e => { e.preventDefault(); run($("q").value); };

// ---------- understanding the question
function understand(q) {
  const syms = new Map(), neg = new Set(), ctx = new Set();
  for (const m of q.matchAll(lexRx)) {
    const name = G.lexicon[m[1].toLowerCase()];
    const before = q.slice(Math.max(0, m.index - 40), m.index).split(/\s+/).slice(-4).join(" ");
    if (NEG.test(before)) neg.add(name); else if (byId["s:" + name]) syms.set(name, m[1]);
  }
  neg.forEach(n => syms.delete(n));
  CTX_RULES.forEach(([name, rx]) => { if (rx.test(q)) ctx.add(name); });
  if (ctx.has("Postpartum")) ctx.delete("Pregnancy");
  const age = q.match(/\b(\d{2})\s?(-?\s?years?|-year-old|yo\b|y\/o|yrs?\b|F\b)/i);
  if (age) { const a = +age[1]; ctx.add(a >= 65 ? "Age: 65 or older" : a >= 45 ? "Age: middle-aged" : a <= 24 ? "Age: adolescent or young adult" : "Age: adult"); }
  return { syms, neg, ctx };
}
function ctxBit(name) { return M ? M.context.indexOf(name) : -1; }
function hasCtx(pid, name) { if (!M || M.context_available === false) return 0; const i = mapIdx[pid], b = ctxBit(name); return i !== undefined && b >= 0 && (M.papers[i][6] >> b) & 1; }

// ---------- offline ranking over the evidence graph
function treeLeaf(u) {
  if (!T) return null;
  const feats = new Set([...u.syms.keys(), ...u.ctx]);
  Object.entries(T.merge || {}).forEach(([name, members]) => { if (members.some(m => feats.has(m))) feats.add(name); });
  let n = T.tree; const steps = [];
  while (!n.leaf) { const yes = feats.has(n.feature); steps.push([n.feature, yes]); n = yes ? n.yes : n.no; }
  return { leaf: n, steps };
}
function graphRank(syms, ctx, leaf) {
  // how well a paper's condition group fits the decision-tree leaf for this question (share of the leaf's papers)
  const fit = {};
  if (leaf) leaf.groups.forEach(([g, c]) => fit[g] = c / leaf.papers);
  const groupFit = pid => { const i = mapIdx[pid]; return i === undefined ? 0 : (fit[M.groups[M.papers[i][3]]] || 0); };
  const score = {};
  [...syms.keys()].forEach(s => Object.entries(byId["s:" + s].evidence).forEach(([pid, ev]) => {
    const r = score[pid] || (score[pid] = { n: 0, f: 0, w: 0, ev: [] });
    r.n++; r.f += ev.findings; r.w += ev.weight; r.ev.push([s, ev]);
  }));
  const ctxHits = pid => [...ctx].filter(c => hasCtx(pid, c)).length;
  const ids = Object.keys(score).sort((a, b) => (score[b].n - score[a].n) || (ctxHits(b) - ctxHits(a))
    || (groupFit(b) - groupFit(a)) || (score[b].f - score[a].f) || (score[b].w - score[a].w));
  return { ids, score };
}

function highlight(text, words) {
  let h = esc(text);
  words.forEach(w => { if (w) h = h.replace(new RegExp("\\b(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "gi"), "<mark>$1</mark>"); });
  return h;
}
function safeSnippet(s) { return esc(s).replace(/&lt;mark&gt;/g, "<mark>").replace(/&lt;\/mark&gt;/g, "</mark>"); }

const PERSON_SVG = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="14" r="7" fill="currentColor" opacity=".9"/><path d="M6 36c1.5-8 7-12 14-12s12.5 4 14 12" fill="currentColor" opacity=".55"/></svg>';
const PLAIN = {"Dyspnea":"Short of breath","Dyspnea, Paroxysmal":"Breathless at night","Edema":"Swelling","Fatigue":"Tiredness",
  "Chest Pain":"Chest pain","Syncope":"Fainting","Nausea":"Feeling sick","Vomiting":"Vomiting","Palpitations":"Racing heart",
  "Dizziness":"Dizziness","Headache":"Headache","Anxiety":"Anxiety","Pelvic Pain":"Pelvic pain","Abdominal Pain":"Tummy pain",
  "Visual Disturbances":"Blurred vision","Hot Flashes":"Hot flushes","Sleep Wake Disorders":"Poor sleep","Sweating":"Sweating",
  "Angina Pectoris":"Chest tightness","Angina, Stable":"Chest tightness","Angina, Unstable":"Chest tightness","Jaw Pain":"Jaw ache",
  "Arm Pain":"Arm pain","Neck Pain":"Neck pain","Back Pain":"Back pain","Low Back Pain":"Lower back pain","Dyspepsia":"Indigestion",
  "Myalgia":"Aching muscles","Muscle Weakness":"Weak muscles","Muscle Cramp":"Cramps","Chronic Pain":"Long-lasting pain",
  "Musculoskeletal Pain":"Muscle or joint pain","Arthralgia":"Joint pain","Snoring":"Snoring","Cough":"Cough","Fever":"Fever",
  "Confusion":"Confusion","Cyanosis":"Bluish skin","Hearing Loss":"Hearing loss","Constipation":"Constipation","Diarrhea":"Diarrhoea",
  "Epistaxis":"Nosebleeds","Hemoptysis":"Coughing blood","Urinary Incontinence":"Leaking urine","Urinary Incontinence, Urge":"Urge to pee",
  "Nocturia":"Peeing at night","Paresthesia":"Pins and needles","Pruritus":"Itching","Tinnitus":"Ringing ears","Dysmenorrhea":"Painful periods",
  "Anorexia":"No appetite","Flatulence":"Wind","Mastodynia":"Breast pain","Intermittent Claudication":"Leg pain when walking",
  "Memory Disorders":"Memory problems","Hirsutism":"Extra hair growth"};
const CTXP = {"Pregnancy":"Pregnant","Postpartum":"After birth","Menopause":"Menopause","Age: 65 or older":"65+","Age: middle-aged":"45–64",
  "Age: adult":"25–44","Age: adolescent or young adult":"Under 25"};
const QP = {"Pregnancy":"Pregnant","Postpartum":"After birth","Menopause":"Menopause","Age: 65 or older":"65 or older","Age: middle-aged":"Aged 45–64",
  "Age: adolescent or young adult":"Under 25","Design: randomised trial":"Trial study","Design: cohort or observational":"Follow-up study",
  "Design: cross-sectional":"Survey study"};
const GROUPP = {"Hypertensive disorders of pregnancy":"High blood pressure in pregnancy","Hypertension":"High blood pressure",
  "Coronary / ischaemic heart disease":"Coronary heart disease","Thrombosis / embolism":"Blood clots","Stroke / cerebrovascular":"Stroke",
  "Arrhythmia":"Heart rhythm problems","Cardiomyopathy":"Heart muscle disease","Heart valve disease":"Heart valve disease",
  "Heart failure":"Heart failure","Other vascular":"Other blood vessel conditions","Other heart":"Other heart conditions",
  "Other cardiovascular":"Other heart and vessel conditions"};
const plain = s => PLAIN[s] || QP[s] || s;
const gplain = g => GROUPP[g] || g;
const SPLIT = ["--accent", "--teal", "--rule-strong"];

// ---------- one question
async function run(q) {
  q = (q || "").trim(); if (!q || !G) return;
  const runId = ++lastRun;
  const u = understand(q);
  $("out").hidden = false;
  document.querySelectorAll(".step").forEach(s => s.classList.remove("on"));
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".step").forEach(s => s.classList.add("on"))));
  renderHeard(u);
  const tl = treeLeaf(u);
  const { ids, score } = graphRank(u.syms, u.ctx, tl && tl.leaf);
  renderTree(tl, u);
  renderSummary(u, ids);
  const words = [...u.syms.values()], symNames = [...u.syms.keys()];
  const offline = ids.slice(0, 10).map(pid => ({ pid, src: "graph", sc: score[pid] }));
  renderStudies(offline, words, symNames);
  drawMap(ids, offline.map(o => o.pid));
  $("livestate").hidden = true;
  $("out").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  if (!live || !u.syms.size) return;
  // live: full-text search on our server, merged with the saved ranking
  const terms = [...new Set([...u.syms.values(), ...u.syms.keys()].map(t => t.toLowerCase()))].map(t => t.includes(" ") ? `"${t}"` : t);
  try {
    const url = "/api/fulltext?" + new URLSearchParams({ q: terms.join(" OR "), area: "C14 Cardiovascular Diseases", per_page: "20" });
    const r = await fetch(url, { signal: timeout(9000) });
    if (runId !== lastRun) return;
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const liveRes = j.results || [];
    const rr = {};
    ids.slice(0, 50).forEach((pid, i) => rr[pid] = (rr[pid] || 0) + 1 / (60 + i + 1));
    liveRes.forEach((p, i) => rr[p.paper_id] = (rr[p.paper_id] || 0) + 1 / (60 + i + 1));
    const liveBy = Object.fromEntries(liveRes.map(p => [p.paper_id, p]));
    const merged = Object.keys(rr).sort((a, b) => rr[b] - rr[a]).slice(0, 10)
      .map(pid => ({ pid, src: liveBy[pid] ? "live" : "graph", sc: score[pid], live: liveBy[pid] }));
    renderStudies(merged, words, symNames);
    drawMap(ids, merged.map(o => o.pid));
    $("livestate").hidden = false; $("livestate").className = "tag live"; $("livestate").textContent = "Live: full text";
  } catch (e) { /* offline answer stays */ }
}

function renderHeard(u) {
  const s = [...u.syms.keys()].map(n => `<span class="pill">${esc(plain(n))}</span>`);
  const c = [...u.ctx].map(n => `<span class="pill ctx">${esc(CTXP[n] || n)}</span>`);
  const x = [...u.neg].map(n => `<span class="pill neg">${esc(plain(n))}</span>`);
  const said = `<p class="said">“${highlight($("q").value.trim(), [...u.syms.values()])}”</p><div class="down" aria-hidden="true">↓</div>`;
  $("heard").innerHTML = s.length || c.length ? said + `<div class="pills">${s.concat(c, x).join("")}</div>` + (s.length ? "" : '<p class="empty">Add a symptom, e.g. chest pain</p>')
    : '<p class="empty">No symptom recognised. Try “chest pain” or “out of breath”.</p>';
}

function renderTree(tl, u) {
  const el = $("tree");
  if (!tl || !u.syms.size && !u.ctx.size) { el.innerHTML = '<p class="empty">—</p>'; return; }
  const n = tl.leaf, total = n.groups.reduce((a, [, c]) => a + c, 0) || 1;
  const top = n.groups.slice(0, 3);
  const steps = tl.steps.map(([f, y]) => `<li><span class="q">${esc(plain(f))}?</span><span class="yn ${y ? "" : "no"}">${y ? "YES" : "NO"}</span></li>`).join("");
  el.innerHTML = `<ol class="path">${steps}</ol><div class="arrow" aria-hidden="true">↓</div>
    <div class="dest"><b>${esc(gplain(top[0][0]))}</b>
      <div class="split" role="img" aria-label="Share of matching studies per condition">${top.map(([g, c], i) => `<span style="width:${100 * c / total}%;background:var(${SPLIT[i]})"></span>`).join("")}<span style="flex:1;background:var(--tint)"></span></div>
      <div class="splitkey">${top.map(([g, c], i) => `<span><i style="background:var(${SPLIT[i]})"></i>${esc(gplain(g))} · ${Math.round(100 * c / total)}%</span>`).join("")}</div>
    </div>`;
}

function renderSummary(u, ids) {
  const n = ids.length;
  let gaps = "";
  if (M && M.context_available !== false) u.ctx.forEach(c => {
    const k = ids.filter(p => hasCtx(p, c)).length;
    if (k < 5) gaps += `<div class="gap">Only ${k} ${k === 1 ? "study" : "studies"} for “${esc(CTXP[c] || c)}”: a research gap</div>`;
  });
  $("summary").innerHTML = `<div class="big" data-to="${n}">0<small>studies match</small></div>${gaps}`;
  const el = $("summary").querySelector(".big"), to = n, t0 = performance.now();
  const tick = t => { const k = Math.min(1, (t - t0) / 700); el.firstChild.nodeValue = Math.round(to * (1 - Math.pow(1 - k, 3))).toLocaleString(); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

function renderStudies(list, words, symNames) {
  const el = $("studies");
  if (!list.length) { el.innerHTML = '<li class="empty">No studies found.</li>'; return; }
  el.innerHTML = list.map((o, k) => {
    const i = mapIdx[o.pid], mp = i !== undefined ? M.papers[i] : null;
    const title = (o.live && o.live.title) || (G.papers[o.pid] && G.papers[o.pid].title) || (mp && mp[5]) || o.pid;
    const year = (o.live && o.live.pub_year) || (mp && mp[4]) || (G.papers[o.pid] && G.papers[o.pid].year) || "";
    const group = mp ? gplain(M.groups[mp[3]]) : "";
    let quote = "";
    if (o.sc) { const ev = o.sc.ev.find(([, e]) => e.sentence); if (ev) quote = `<p class="quote">${highlight(ev[1].sentence, words.concat(symNames))}${ev[1].sentence.length >= 400 ? "…" : ""}</p>`; }
    if (!quote && o.live && o.live.passages && o.live.passages[0]) quote = `<p class="quote">${safeSnippet(o.live.passages[0].snippet)}</p>`;
    return `<li><div class="top"><span class="rank">${k + 1}</span><div class="ptitle"><a href="https://europepmc.org/article/PMC/${esc(o.pid)}" target="_blank" rel="noopener">${esc(title)}</a></div></div>
      ${quote}<div class="tags">${year ? `<span class="tag">${esc(year)}</span>` : ""}${group ? `<span class="tag">${esc(group)}</span>` : ""}${o.src === "live" ? '<span class="tag live">Live</span>' : ""}</div>
      ${live ? `<button type="button" class="more" data-sim="${esc(o.pid)}">Similar studies</button><div></div>` : ""}</li>`;
  }).join("");
  el.querySelectorAll("[data-sim]").forEach(b => b.onclick = () => similar(b));
}

async function similar(btn) {
  const box = btn.nextElementSibling; btn.disabled = true; box.textContent = "…";
  try {
    const r = await fetch("/api/fulltext?" + new URLSearchParams({ similar: btn.dataset.sim }), { signal: timeout(9000) });
    const j = await r.json();
    box.innerHTML = `<ol class="similar">${(j.results || []).slice(0, 5).map(p => `<li><a href="https://europepmc.org/article/PMC/${esc(p.paper_id)}" target="_blank" rel="noopener">${esc(p.title)}</a> · ${esc(p.pub_year || "")}</li>`).join("")}</ol>`;
  } catch (e) { box.textContent = "Offline"; btn.disabled = false; }
}

let lastMap = null;
function drawMap(matched, top) {
  lastMap = [matched, top];
  const cv = $("map");
  if (!M) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 340;
  cv.width = w * dpr; cv.height = w * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const xs = M.papers.map(p => p[1]), ys = M.papers.map(p => p[2]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 12, sx = x => pad + (x - x0) / (x1 - x0) * (w - 2 * pad), sy = y => pad + (y - y0) / (y1 - y0) * (w - 2 * pad);
  ctx.fillStyle = css("--dot");
  M.papers.forEach(p => { ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 1.4, 0, 7); ctx.fill(); });
  ctx.fillStyle = css("--accent");
  matched.forEach(pid => { const i = mapIdx[pid]; if (i === undefined) return; const p = M.papers[i]; ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 3, 0, 7); ctx.fill(); });
  ctx.font = "700 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  top.forEach((pid, k) => { const i = mapIdx[pid]; if (i === undefined) return; const p = M.papers[i];
    ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 7.5, 0, 7); ctx.fillStyle = css("--teal"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css("--surface"); ctx.stroke(); ctx.fillStyle = "#fff"; ctx.fillText(k + 1, sx(p[1]), sy(p[2]) + .5); });
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => lastMap && drawMap(...lastMap), 150); });
</script>
