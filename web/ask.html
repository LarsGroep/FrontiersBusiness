<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --paper:#FCF4F3; --surface:#FFFFFF; --tint:#F7E8E7;
  --ink:#2B1A1E; --ink-2:#523A40; --muted:#765C62;
  --rule:#EFD9D8; --rule-strong:#D5ABAE; --field:#A8757C;
  --accent:#B03A56; --accent-strong:#8F2A44; --accent-soft:#F9E1E4; --on-accent:#FFFFFF;
  --teal:#2A6F73; --teal-soft:#DFEEED;
  --marker:#FFE08A; --marker-ink:#2B1A1E;
  --warn:#7A4A00; --warn-line:#C77700; --warn-soft:#FFF0C2;
  --focus:#1F5FD1; --dot:#D9CBCB;
  --shadow:0 1px 2px rgba(92,38,50,.06),0 4px 14px rgba(92,38,50,.05);
  --radius-s:6px; --radius-m:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --dot:#4A3740; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#1C1215; --surface:#261A1E; --tint:#2E1F24;
    --ink:#F5E9EA; --ink-2:#DCC8CB; --muted:#B39CA1;
    --rule:#3D2A30; --rule-strong:#5A4047; --field:#8F6F77;
    --accent:#F08FA6; --accent-strong:#F7AEBF; --accent-soft:#45222D; --on-accent:#2B1015;
    --teal:#6FC4BE; --teal-soft:#1C3836;
    --marker:#C9A93A; --marker-ink:#1C1215;
    --warn:#F5C065; --warn-line:#D99A2B; --warn-soft:#3B2C0E;
    --focus:#8AB4FF; --dot:#4A3740; --shadow:none;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:inherit;text-decoration-color:var(--rule-strong);text-underline-offset:3px}
a:hover{color:var(--accent-strong);text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
.btn{border:1px solid transparent;border-radius:var(--radius-m);padding:10px 18px;min-height:44px;font-weight:600;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-strong)}
.btn.quiet{background:var(--surface);color:var(--accent-strong);border-color:var(--rule-strong);min-height:0;padding:5px 12px;font-size:13px}
.btn.quiet:hover{background:var(--accent-soft);border-color:var(--accent)}
.sitenav{background:var(--surface);border-bottom:1px solid var(--rule)}
.sitenav > div{max-width:1180px;margin:0 auto;padding:8px 4px;display:flex;flex-wrap:wrap;gap:4px}
.sitenav a{padding:7px 12px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink-2);text-decoration:none}
.sitenav a:hover{background:var(--tint);color:var(--ink)}
.sitenav a[aria-current]{background:var(--accent-soft);color:var(--accent-strong)}

.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.top h1{margin:0;font-size:30px}
.lead{margin:0;color:var(--ink-2);max-width:70ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);font-variant-numeric:tabular-nums}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.live i{background:var(--teal)}
.status.live{color:var(--teal);border-color:var(--teal)}
form.ask{display:flex;gap:8px;flex-wrap:wrap}
form.ask input{flex:1 1 360px;min-width:0;padding:12px 14px;border:1px solid var(--field);border-radius:var(--radius-m);background:var(--surface);font-size:17px}
form.ask input:hover{border-color:var(--accent)}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);border:0}
button.chip{cursor:pointer}
button.chip:hover{background:var(--accent);color:var(--on-accent)}
.chip.ctx{background:var(--teal-soft);color:var(--teal)}
.chip.neg{background:var(--rule);color:var(--muted);text-decoration:line-through}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-m);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{font-size:19px;margin:0 0 10px}
.headline{font-size:20px;line-height:1.35;margin:0 0 12px}
.headline b{font-family:var(--serif);font-size:30px;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.bars .track{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:5px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.notes{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.notes li{padding:6px 10px;border-radius:var(--radius-s);background:var(--tint);color:var(--ink-2)}
.notes li.gap{background:var(--warn-soft);color:var(--warn);border-left:3px solid var(--warn-line)}
ol.studies{margin:0;padding-left:22px;display:grid;gap:14px}
ol.studies li{min-width:0;overflow-wrap:anywhere}
.ptitle{font-weight:600;line-height:1.35}
.ptitle a{color:var(--ink);text-decoration:none}
.ptitle a:hover{text-decoration:underline}
.pmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--tint);color:var(--ink-2)}
.tag.live{background:var(--teal-soft);color:var(--teal)}
.sent{font-size:14px;color:var(--ink-2);border-left:3px solid var(--rule-strong);padding:2px 0 2px 10px;margin-top:6px}
mark{background:var(--marker);color:var(--marker-ink);border-radius:2px;padding:0 2px}
.similar{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.path{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.path li{display:flex;gap:8px;align-items:baseline}
.path .q{font-weight:600}
.path .a{font-size:12px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.path .a.no{background:var(--tint);color:var(--muted)}
.mapwrap{position:relative}
canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:var(--radius-s);background:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:13px;color:var(--muted);margin:0}
.safety{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px}
.empty{color:var(--muted)}
.spin{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.bars li{grid-template-columns:minmax(0,1fr) 90px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="sitenav" aria-label="Site"><div><a href="/">Search</a><a href="/themes.html">Themes</a><a href="/ask" aria-current="page">Ask the evidence</a><a href="/chat">Ask the research</a></div></nav>
<div class="wrap">
  <div class="top">
    <h1>Ask the evidence</h1>
    <span class="status" id="status"><i></i><span id="statustext">Loading the evidence…</span></span>
  </div>
  <p class="lead">Women-only cardiovascular studies. Information, not a diagnosis.</p>
  <form class="ask" id="ask">
    <input id="q" type="search" autocomplete="off" placeholder="Symptoms, e.g. 58-year-old woman, jaw ache, feeling sick" aria-label="Symptoms">
    <button class="btn" type="submit">Search</button>
  </form>
  <div class="examples" id="examples">Try:</div>

  <div id="out" hidden>
    <div class="understood" id="understood"></div>
    <div class="grid" style="margin-top:14px">
      <div class="col">
        <section class="card" aria-labelledby="h-sum"><h2 id="h-sum">Evidence</h2><div id="summary"></div></section>
        <section class="card" aria-labelledby="h-stu"><h2 id="h-stu">Studies <span class="spin" id="livestate"></span></h2><ol class="studies" id="studies"></ol></section>
      </div>
      <div class="col">
        <section class="card" aria-labelledby="h-tree"><h2 id="h-tree">Decision tree</h2><div id="tree"></div></section>
        <section class="card" aria-labelledby="h-map"><h2 id="h-map">Map</h2>
          <div class="mapwrap"><canvas id="map" width="600" height="600" aria-label="Map of the cardiovascular women-only papers with the matching studies highlighted"></canvas></div>
          <div class="legend"><span><i style="background:var(--dot)"></i>all papers</span><span><i style="background:var(--accent)"></i>match</span><span><i style="background:var(--teal)"></i>top 10</span></div>
          <p class="note" id="mapnote"></p>
        </section>
      </div>
    </div>
  </div>
  <p class="safety">Not medical advice. Emergency: call 112.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NEG = /\b(no|not|without|absence of|denies|denied|free of|negative for)\b/i;
const EXAMPLES = ["58-year-old woman, jaw ache and feeling sick while gardening", "34 weeks pregnant, swollen ankles and headache",
                  "palpitations and dizziness during menopause", "out of breath and exhausted, 3 months after giving birth"];
const CTX_RULES = [
  ["Pregnancy", /pregnan|gestation|trimester|\b\d{1,2}\s?(wk|wks|weeks)\b(?![^,.]*(postnatal|postpartum|after))/i],
  ["Postpartum", /postpartum|postnatal|post-natal|after (giving )?birth|had (a |her )?baby|after delivery|puerper|months? after/i],
  ["Menopause", /menopaus|hot flush|hot flash/i],
];
let G, T, M, lexRx, byId = {}, mapIdx = {}, live = false, liveCount = 0, lastRun = 0;

// ---------- load the precomputed evidence, then check the Pi
Promise.all(["/graph/cv.json", "/graph/tree-cv.json", "/graph/papers-cv.json"].map(u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null)))
  .then(([g, t, m]) => {
    if (!g) { $("statustext").textContent = "The evidence data could not be loaded."; return; }
    G = g; T = t; M = m;
    G.nodes.forEach(n => byId[n.id] = n);
    if (M) M.papers.forEach((p, i) => mapIdx[p[0]] = i);
    const terms = Object.keys(G.lexicon).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    lexRx = new RegExp("\\b(" + terms.join("|") + ")\\b", "gi");
    setStatus();
    EXAMPLES.forEach(e => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = e;
      b.onclick = () => { $("q").value = e; run(e); }; $("examples").appendChild(b); });
    checkPi();
  });

function setStatus() {
  const n = (M ? M.papers.length : G.papers_in_area).toLocaleString();
  if (live) { $("status").classList.add("live"); $("statustext").textContent = `Pi online · ${liveCount.toLocaleString()} papers`; }
  else { $("status").classList.remove("live"); $("statustext").textContent = `Offline · ${n} papers`; }
}
function timeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
async function checkPi() {
  try {
    const r = await fetch("/api/fulltext?health=1", { signal: timeout(3500), cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    live = !!(j && j.ok); liveCount = j && j.papers || 0;
  } catch (e) { live = false; }
  setStatus();
  if (lastRun && live) run($("q").value);          // the Pi came online: enrich the current answer
}
setInterval(checkPi, 60000);                         // picks up the Pi being plugged in or out during a demo

$("ask").onsubmit = e => { e.preventDefault(); run($("q").value); };

// ---------- understanding the question
function understand(q) {
  const syms = new Map(), neg = new Set(), ctx = new Set();
  for (const m of q.matchAll(lexRx)) {
    const name = G.lexicon[m[1].toLowerCase()];
    const before = q.slice(Math.max(0, m.index - 40), m.index).split(/\s+/).slice(-4).join(" ");
    if (NEG.test(before)) neg.add(name); else if (byId["s:" + name]) syms.set(name, m[1]);
  }
  neg.forEach(n => syms.delete(n));
  CTX_RULES.forEach(([name, rx]) => { if (rx.test(q)) ctx.add(name); });
  if (ctx.has("Postpartum")) ctx.delete("Pregnancy");
  const age = q.match(/\b(\d{2})\s?(-?\s?years?|-year-old|yo\b|y\/o|yrs?\b|F\b)/i);
  if (age) { const a = +age[1]; ctx.add(a >= 65 ? "Age: 65 or older" : a >= 45 ? "Age: middle-aged" : a <= 24 ? "Age: adolescent or young adult" : "Age: adult"); }
  return { syms, neg, ctx };
}
function ctxBit(name) { return M ? M.context.indexOf(name) : -1; }
function hasCtx(pid, name) { if (!M || M.context_available === false) return 0; const i = mapIdx[pid], b = ctxBit(name); return i !== undefined && b >= 0 && (M.papers[i][6] >> b) & 1; }

// ---------- offline ranking over the evidence graph
function treeLeaf(u) {
  if (!T) return null;
  const feats = new Set([...u.syms.keys(), ...u.ctx]);
  let n = T.tree; const steps = [];
  while (!n.leaf) { const yes = feats.has(n.feature); steps.push([n.feature, yes]); n = yes ? n.yes : n.no; }
  return { leaf: n, steps };
}
function graphRank(syms, ctx, leaf) {
  // how well a paper's condition group fits the decision-tree leaf for this question (share of the leaf's papers)
  const fit = {};
  if (leaf) leaf.groups.forEach(([g, c]) => fit[g] = c / leaf.papers);
  const groupFit = pid => { const i = mapIdx[pid]; return i === undefined ? 0 : (fit[M.groups[M.papers[i][3]]] || 0); };
  const score = {};
  [...syms.keys()].forEach(s => Object.entries(byId["s:" + s].evidence).forEach(([pid, ev]) => {
    const r = score[pid] || (score[pid] = { n: 0, f: 0, w: 0, ev: [] });
    r.n++; r.f += ev.findings; r.w += ev.weight; r.ev.push([s, ev]);
  }));
  const ctxHits = pid => [...ctx].filter(c => hasCtx(pid, c)).length;
  const ids = Object.keys(score).sort((a, b) => (score[b].n - score[a].n) || (ctxHits(b) - ctxHits(a))
    || (groupFit(b) - groupFit(a)) || (score[b].f - score[a].f) || (score[b].w - score[a].w));
  return { ids, score };
}

function highlight(text, words) {
  let h = esc(text);
  words.forEach(w => { if (w) h = h.replace(new RegExp("\\b(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "gi"), "<mark>$1</mark>"); });
  return h;
}
function safeSnippet(s) { return esc(s).replace(/&lt;mark&gt;/g, "<mark>").replace(/&lt;\/mark&gt;/g, "</mark>"); }

// ---------- one question
async function run(q) {
  q = (q || "").trim(); if (!q || !G) return;
  const runId = ++lastRun;
  const u = understand(q);
  $("out").hidden = false;
  $("understood").innerHTML = ([...u.syms.keys()].map(s => `<span class="chip">${esc(s)}</span>`).join(" ") || '<span class="empty">No symptom recognised</span>')
    + [...u.ctx].map(c => ` <span class="chip ctx">${esc(c)}</span>`).join("") + [...u.neg].map(n => ` <span class="chip neg">${esc(n)}</span>`).join("");
  const tl = treeLeaf(u);
  const { ids, score } = graphRank(u.syms, u.ctx, tl && tl.leaf);
  renderSummary(u, ids, score);
  renderTree(tl);
  const words = [...u.syms.values()];
  const symNames = [...u.syms.keys()];
  const offline = ids.slice(0, 10).map(pid => ({ pid, src: "graph", sc: score[pid] }));
  renderStudies(offline, words, symNames, u);
  drawMap(ids, offline.map(o => o.pid));
  $("livestate").textContent = live ? "…" : "";
  if (!live || !u.syms.size) { if (!live) $("livestate").textContent = ""; return; }
  // live: full-text search on the Pi (newest papers, results sections), merged with the graph ranking
  const terms = [...new Set([...u.syms.values(), ...u.syms.keys()].map(t => t.toLowerCase()))].map(t => t.includes(" ") ? `"${t}"` : t);
  try {
    const url = "/api/fulltext?" + new URLSearchParams({ q: terms.join(" OR "), area: "C14 Cardiovascular Diseases", per_page: "20" });
    const r = await fetch(url, { signal: timeout(9000) });
    if (runId !== lastRun) return;
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const liveRes = (j.results || []);
    const rr = {};
    ids.slice(0, 50).forEach((pid, i) => rr[pid] = (rr[pid] || 0) + 1 / (60 + i + 1));
    liveRes.forEach((p, i) => rr[p.paper_id] = (rr[p.paper_id] || 0) + 1 / (60 + i + 1));
    const liveBy = Object.fromEntries(liveRes.map(p => [p.paper_id, p]));
    const merged = Object.keys(rr).sort((a, b) => rr[b] - rr[a]).slice(0, 10)
      .map(pid => ({ pid, src: score[pid] && liveBy[pid] ? "both" : liveBy[pid] ? "live" : "graph", sc: score[pid], live: liveBy[pid] }));
    renderStudies(merged, words, symNames, u);
    drawMap(ids, merged.map(o => o.pid));
    $("livestate").textContent = `· ${j.total.toLocaleString()} on the Pi`;
  } catch (e) {
    if (runId === lastRun) $("livestate").textContent = "· Pi offline";
  }
}

function renderSummary(u, ids, score) {
  const el = $("summary");
  if (!u.syms.size) { el.innerHTML = '<p class="empty">Add a symptom.</p>'; return; }
  const all = ids.filter(p => score[p].n === u.syms.size).length;
  const names = [...u.syms.keys()];
  const groups = {};
  ids.forEach(pid => { const i = mapIdx[pid]; const g = i === undefined ? "Not on the map" : M.groups[M.papers[i][3]]; groups[g] = (groups[g] || 0) + 1; });
  const rows = Object.entries(groups).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const max = rows.length ? rows[0][1] : 1;
  const notes = [];
  if (names.length > 1) notes.push(`<li>All symptoms: ${all}</li>`);
  if (M && M.context_available !== false) u.ctx.forEach(c => {
    const n = ids.filter(p => hasCtx(p, c)).length;
    notes.push(`<li class="${n < 5 ? "gap" : ""}">${esc(c.replace("Age: ", ""))}: ${n}${n < 5 ? " (gap)" : ""}</li>`);
  });
  if (ids.length && ids.length < 10) notes.push(`<li class="gap">Few studies</li>`);
  el.innerHTML = `<p class="headline"><b>${ids.length}</b> ${ids.length === 1 ? "study" : "studies"}</p>
    <ul class="bars">${rows.map(([g, n]) => `<li><span>${esc(g)}</span><span class="track"><span class="fill" style="width:${Math.max(3, 100 * n / max)}%;display:block"></span></span><span class="n">${n}</span></li>`).join("")}</ul>
    <ul class="notes">${notes.join("")}</ul>`;
}

function renderStudies(list, words, symNames, u) {
  const el = $("studies");
  if (!list.length) { el.innerHTML = '<li class="empty">No studies found.</li>'; return; }
  el.innerHTML = list.map((o, k) => {
    const i = mapIdx[o.pid], mp = i !== undefined ? M.papers[i] : null;
    const title = (o.live && o.live.title) || (G.papers[o.pid] && G.papers[o.pid].title) || (mp && mp[5]) || o.pid;
    const year = (o.live && o.live.pub_year) || (mp && mp[4]) || (G.papers[o.pid] && G.papers[o.pid].year) || "";
    const group = mp ? M.groups[mp[3]] : "";
    const ctxTags = mp ? M.context.filter((c, b) => (mp[6] >> b) & 1 && !c.startsWith("Design")).map(c => c.replace("Age: ", "")) : [];
    const design = mp ? M.context.filter((c, b) => (mp[6] >> b) & 1 && c.startsWith("Design")).map(c => c.replace("Design: ", "")) : [];
    let sents = "";
    if (o.sc) sents = o.sc.ev.filter(([, ev], k, all) => ev.sentence && all.findIndex(([, e]) => e.sentence === ev.sentence) === k).slice(0, 2).map(([s, ev]) => `<div class="sent">${highlight(ev.sentence, words.concat(symNames))}<span class="pmeta">${esc(ev.section || "")}${ev.findings ? " · finding" : ""}</span></div>`).join("");
    if (!sents && o.live && o.live.passages) sents = o.live.passages.slice(0, 1).map(p => `<div class="sent">${safeSnippet(p.snippet)}<span class="pmeta">${esc(p.section)}</span></div>`).join("");
    if (!sents && o.sc) sents = '<div class="sent empty">Quote not shown (licence)</div>';
    const src = o.src === "live" || o.src === "both" ? '<span class="tag live">Pi</span>' : "";
    return `<li><div class="ptitle"><a href="https://europepmc.org/article/PMC/${esc(o.pid)}" target="_blank" rel="noopener">${esc(title)}</a></div>
      <div class="pmeta"><span>${esc(year)}</span>${group ? `<span class="tag">${esc(group)}</span>` : ""}${design.map(d => `<span class="tag">${esc(d)}</span>`).join("")}${ctxTags.map(c => `<span class="tag">${esc(c)}</span>`).join("")}${src}</div>
      ${sents}${live ? `<button type="button" class="btn quiet" data-sim="${esc(o.pid)}" style="margin-top:6px">Similar studies</button><div class="simbox"></div>` : ""}</li>`;
  }).join("");
  el.querySelectorAll("[data-sim]").forEach(b => b.onclick = () => similar(b));
}

async function similar(btn) {
  const box = btn.nextElementSibling; btn.disabled = true; box.innerHTML = '<span class="spin">…</span>';
  try {
    const r = await fetch("/api/fulltext?" + new URLSearchParams({ similar: btn.dataset.sim }), { signal: timeout(9000) });
    const j = await r.json();
    box.innerHTML = `<ol class="similar">${(j.results || []).slice(0, 5).map(p => `<li><a href="https://europepmc.org/article/PMC/${esc(p.paper_id)}" target="_blank" rel="noopener">${esc(p.title)}</a> <span class="pmeta" style="display:inline">${esc(p.pub_year || "")} · similarity ${Math.round(p.similarity * 100)}%</span></li>`).join("")}</ol>`;
  } catch (e) { box.innerHTML = '<span class="spin">Pi offline</span>'; btn.disabled = false; }
}

function renderTree(tl) {
  const el = $("tree");
  if (!tl) { el.innerHTML = '<p class="empty">Not built yet.</p>'; return; }
  const n = tl.leaf, steps = tl.steps;
  const max = n.groups[0] ? n.groups[0][1] : 1;
  el.innerHTML = `<ol class="path">${steps.map(([f, y]) => `<li><span class="a ${y ? "" : "no"}">${y ? "yes" : "no"}</span><span class="q">${esc(f)}?</span></li>`).join("")}</ol>
    <p class="note" style="margin:10px 0 6px">${n.papers} papers on this branch</p>
    <ul class="bars">${n.groups.slice(0, 4).map(([g, c]) => `<li><span>${esc(g)}</span><span class="track"><span class="fill" style="width:${Math.max(3, 100 * c / max)}%;display:block;background:var(--teal)"></span></span><span class="n">${c}</span></li>`).join("")}</ul>
    `;
}

let lastMap = null;
function drawMap(matched, top) {
  lastMap = [matched, top];
  const cv = $("map");
  if (!M) { $("mapnote").textContent = "Not built yet."; return; }
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 500;
  cv.width = w * dpr; cv.height = w * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const xs = M.papers.map(p => p[1]), ys = M.papers.map(p => p[2]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 14, sx = x => pad + (x - x0) / (x1 - x0) * (w - 2 * pad), sy = y => pad + (y - y0) / (y1 - y0) * (w - 2 * pad);
  ctx.fillStyle = css("--dot");
  M.papers.forEach(p => { ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 1.6, 0, 7); ctx.fill(); });
  ctx.fillStyle = css("--accent");
  matched.forEach(pid => { const i = mapIdx[pid]; if (i === undefined) return; const p = M.papers[i]; ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 3.2, 0, 7); ctx.fill(); });
  ctx.font = "600 11px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  top.forEach((pid, k) => { const i = mapIdx[pid]; if (i === undefined) return; const p = M.papers[i];
    ctx.beginPath(); ctx.arc(sx(p[1]), sy(p[2]), 8, 0, 7); ctx.fillStyle = css("--teal"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css("--surface"); ctx.stroke(); ctx.fillStyle = css("--surface"); ctx.fillText(k + 1, sx(p[1]), sy(p[2]) + .5); });
  const onMap = matched.filter(p => mapIdx[p] !== undefined).length;
  $("mapnote").textContent = `t-SNE · ${M.papers.length.toLocaleString()} papers · ${onMap} match`;
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => lastMap && drawMap(...lastMap), 150); });
</script>
</body>
