<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{margin:0;background:#FFF3F5;font-family:Poppins,system-ui,sans-serif;color:#5C2234}
a{color:#B03A56}a:hover{color:#8E2F47}

@keyframes fl{from{box-shadow:0 0 0 4px #F27383}to{box-shadow:0 12px 34px rgba(142,47,71,.09)}}

</style>
</head>
<body>
<div id="app"></div>
<script>

    if (st.age === '45-64') feats.add('Age: middle-aged');
    if (st.age === '65+') feats.add('Age: 65 or older');
    Object.entries(D.merge || {}).forEach(([name, mem]) => { if (mem.some((m) => feats.has(m))) feats.add(name); });
    const PL = { 'Pregnancy': 'Pregnant', 'Postpartum': 'Just gave birth', 'Menopause': 'Menopause', 'Age: adolescent or young adult': 'Under 25', 'Age: middle-aged': 'Aged 45 to 64', 'Age: 65 or older': '65 or older', 'Design: randomised trial': 'Trial study', 'Design: cohort or observational': 'Follow-up study', 'Design: cross-sectional': 'Survey study', 'Pain spreading from the chest': 'Pain spreading from the chest', 'Muscle pain or weakness': 'Muscle pain or weakness', 'Pelvic Pain': 'Pelvic pain', 'Cyanosis': 'Bluish lips', 'Snoring': 'Snoring', 'Hirsutism': 'Extra hair growth', 'Urinary Incontinence': 'Leaking urine', 'Sleep Wake Disorders': 'Poor sleep', 'Myalgia': 'Aching muscles', 'Muscle Weakness': 'Weak muscles', 'Fever': 'Fever' };

    let n = D.tree; const path = [];
    while (!n.leaf) { const yes = feats.has(n.f); path.push({ q: plainOf(n.f) + '?', yes, a: yes ? 'yes' : 'no', ansStyle: 'font-size: 11px; font-weight: 700; color: #FFFFFF; border-radius: 999px; padding: 1px 7px; margin-left: 4px; background: ' + (yes ? '#B03A56' : '#B9A6AD') }); n = yes ? n.yes : n.no; }

  renderVals() {

      ['Collected and checked', 50748, '50,748', 'Studies in which only women took part, from Europe PMC. In a hand check, about 9 in 10 were truly women-only.'],
      ['Heart and blood vessels', 5500, '≈ 5,500', 'Studies about the heart and blood vessels.'],
      ['Women’s symptoms described', 855, '855', 'Heart studies that describe the symptoms the women actually had.'],
      ['Match her symptoms', 280, '280', 'Studies of women who had tiredness, breathlessness, swollen ankles or jaw ache.'],

      { tag: 'STEP 1 · THE DATA', title: 'Similar studies group into themes', img: 'img/step4.jpg', alt: 'A map of studies coloured by research theme',

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const comp = new Component({});

        <h3 style="margin:0;font-size:22px;font-weight:700">${esc(s.title)}</h3>
        <p style="margin:0;font-size:16px;line-height:1.55">${esc(s.body)}</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">${s.stats.map((k) => `<div style="background:#FFF3F5;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column"><span style="font-size:22px;font-weight:700;color:#B03A56">${esc(k.v)}</span><span style="font-size:13px">${esc(k.l)}</span></div>`).join('')}</div>
      </div></article>`).join('')}
  </section>
  <section class="w card" aria-label="Test results" style="border-radius:28px;padding:28px;gap:18px">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
      <h2 style="margin:0;font-size:24px;font-weight:700">How well it works</h2>
      <div style="display:flex;gap:16px;font-size:14px"><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:4px;background:#B03A56"></span>Anarcha AI</span><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:4px;background:#CDB7BD"></span>Comparison</span></div>
    </div>
    ${v.tests.map((t) => `<div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:16px;font-weight:600">${esc(t.name)}</span>
      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1 1 auto;height:18px;background:#FFF3F5;border-radius:9px;overflow:hidden"><div style="${t.ours}"></div></div><span style="flex:0 0 64px;font-size:18px;font-weight:700;color:#B03A56;text-align:right">${esc(t.a)}</span></div>
      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1 1 auto;height:18px;background:#FFF3F5;border-radius:9px;overflow:hidden"><div style="${t.base}"></div></div><span style="flex:0 0 64px;font-size:18px;font-weight:600;color:#7A4A58;text-align:right">${esc(t.b)}</span></div>
      <span style="font-size:13px;color:#7A4A58">${esc(t.note)}</span></div>`).join('')}
    <p style="margin:0;font-size:13px;color:#7A4A58">First checks, mostly judged by AI. Next: two doctors check at least 300 examples per test.</p>
  </section>`;
}
function ecgSvg(e) {
  return `<svg viewBox="0 0 1000 ${e.isAF ? 175 : 125}" role="img" aria-label="${esc(e.verdict)}" style="width:100%;height:auto;display:block;border-radius:10px;background:#FFF8F9">
    <defs><pattern id="sm" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#F7DCE2" stroke-width=".5"/></pattern><pattern id="bg" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="url(#sm)"/><path d="M20 0H0V20" fill="none" stroke="#EFC3CD" stroke-width="1"/></pattern></defs>
    <rect width="1000" height="125" fill="url(#bg)"/>
    ${e.gaps.map((g) => `<rect x="${g.x1}" y="0" width="${g.w}" height="125" fill="${g.band}"/><text x="${g.mid}" y="14" text-anchor="middle" font-family="Poppins" font-size="12" font-weight="${g.odd ? 700 : 500}" fill="${g.fill}">${g.ms}</text>`).join('')}
    ${e.isAF ? `<rect x="${e.bx}" y="62" width="${e.bw}" height="44" rx="8" fill="none" stroke="#8E2F47" stroke-width="2" stroke-dasharray="5 4"/><text x="${e.bx + e.bw / 2}" y="121" text-anchor="middle" font-family="Poppins" font-size="12" font-weight="700" fill="#8E2F47">no P wave, wavy line</text>`
      : `<circle cx="${e.pX}" cy="${e.pY}" r="9" fill="none" stroke="#8E2F47" stroke-width="2"/><text x="${e.pX}" y="${+e.pY + 26}" text-anchor="middle" font-family="Poppins" font-size="12" font-weight="700" fill="#8E2F47">P wave</text>`}
    <polyline points="${e.pts}" fill="none" stroke="#C2334F" stroke-width="2" stroke-linejoin="round"/>
    ${e.beats.map((b) => `<circle cx="${b.x}" cy="${b.y}" r="4" fill="#5C2234"/>`).join('')}
    ${e.isAF ? `<g transform="translate(0,128)"><text x="0" y="12" font-family="Poppins" font-size="12" font-weight="600" fill="#9C8890">For comparison, a regular rhythm:</text><polyline transform="translate(0,14)" points="${e.other}" fill="none" stroke="#B9A6AD" stroke-width="1.6"/></g>` : ''}
  </svg>`;
}
function hands(v) {
  const H2_ = (t, extra) => `<h2 style="margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline">${t}${extra ? `<span style="font-size:12px;font-weight:500;color:#9C7380">${extra}</span>` : ''}</h2>`;
  const check = (c) => `<button type="button" role="checkbox" ${on(c.toggle)} aria-checked="${c.checked}" style="${c.row}"><span aria-hidden="true" style="${c.box}">${c.mark}</span>${esc(c.label)}</button>`;
  const sel = 'width:100%;min-height:40px;box-sizing:border-box;padding:6px 32px 6px 10px;border-radius:10px;border:1.5px solid #EAD0D6;background:#fff url(\'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%238E2F47%27 stroke-width=%272%27/%3E%3C/svg%3E\') no-repeat right 12px center;-webkit-appearance:none;appearance:none;font:500 14px Poppins,system-ui,sans-serif;color:#5C2234';
  const lab = (t) => `<span style="font-size:12px;font-weight:600;color:#7A4A58">${t}</span>`;
  const field = (t, inner) => `<label style="display:flex;flex-direction:column;gap:3px;min-width:0">${lab(t)}${inner}</label>`;
  const left = `<aside class="card" style="flex:1 1 300px;max-width:100%;gap:10px;padding:14px">
    ${field('Patient', `<select ${onc(v.pickPreset)} style="${sel}">${v.preset < 0 ? '<option value="-1" selected>Your own patient</option>' : ''}${v.presets.map((p, i) => `<option value="${i}"${v.preset === i ? ' selected' : ''}>${esc(p.name + ': ' + p.line)}</option>`).join('')}</select>`)}
    <div style="display:flex;flex-direction:column;gap:3px">${lab('Symptoms')}
      <button type="button" ${on(v.toggleSym)} aria-expanded="${v.symOpen}" style="${sel};text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;overflow:hidden"><span style="flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.symSummary)}</span><span style="flex:none;font-size:12px;font-weight:700;color:#fff;background:#B03A56;border-radius:999px;padding:1px 8px">${v.nSel}</span></button>
      ${v.symOpen ? `<div style="border:1.5px solid #EAD0D6;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 4px">${v.list.map(check).join('')}</div><button type="button" ${on(v.toggleSym)} style="align-self:flex-end;min-height:34px;padding:4px 16px;border-radius:999px;border:0;background:#B03A56;color:#fff;font:600 13px Poppins,system-ui,sans-serif;cursor:pointer">Done</button></div>` : ''}
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      ${field('Age', `<select ${onc(v.pickAge)} style="${sel}">${v.AGES.map((a) => `<option value="${a}"${v.age === a ? ' selected' : ''}>${a === 'under 25' ? 'Under 25' : a}</option>`).join('')}</select>`)}
      ${field('Life stage', `<select ${onc(v.pickCtx)} style="${sel}"><option value=""${v.ctxKey ? '' : ' selected'}>Nothing special</option>${v.CTX.map(([k, l]) => `<option value="${k}"${v.ctxKey === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`)}
    </div>
    <div style="display:flex;flex-direction:column;gap:3px">${lab('ECG')}
      <div style="display:flex;gap:4px" role="group" aria-label="ECG">${v.ecgOpts.map((a) => `<button type="button" ${on(a.pick)} aria-pressed="${a.pressed}" style="${a.style}">${esc(a.label)}</button>`).join('')}</div></div>
  </aside>`;
  if (v.loading) return `<div class="w" style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">${left}<div class="card" style="flex:999 1 560px"><p style="margin:0">Loading the evidence…</p></div></div>`;
  const hd = (n, t) => `<div style="display:flex;align-items:center;gap:8px"><span class="num">${n}</span><h3 class="h" style="font-size:16px">${t}</h3></div>`;
  const right = `<div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px">
    <section class="card flash" style="background:#8E2F47;color:#fff;gap:10px;padding:18px 20px" aria-live="polite">
      <div style="display:flex;align-items:center;gap:8px"><span class="num" style="background:#fff;color:#8E2F47">AI</span><h3 class="h" style="color:#fff;font-size:16px">The agent's answer</h3></div>
      <p style="margin:0;font-size:13px;color:#FFD6DE;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px">GP typed: ${esc(v.typed)}</p>
      ${v.answer.map((a) => `<p style="margin:0;font-size:15px;line-height:1.5${a.hl ? ';background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px' : ''}">${esc(a.t)}</p>`).join('')}
      <p style="margin:0;font-size:12px;color:#FFD6DE">Research information, not a diagnosis. The doctor decides.</p></section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px">
      <section class="card" style="gap:8px;padding:16px">${hd(1, 'Decision tree, live')}
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px">${v.path.map((q) => `<span style="font-size:13px;font-weight:600;border:1.5px solid #E65C6E;border-radius:10px;padding:3px 8px">${esc(q.q)}<span style="${q.ansStyle}">${q.a}</span></span><span aria-hidden="true" style="color:#E65C6E;font-weight:700">→</span>`).join('')}<span style="font-size:13px;font-weight:700;color:#fff;background:#B03A56;border-radius:10px;padding:4px 10px">${esc(v.leafName)}</span></div>
        ${v.leafBars.map((b) => `<div style="display:flex;align-items:center;gap:8px"><span style="flex:0 1 150px;font-size:12px;line-height:1.2">${esc(b.name)}</span><div style="flex:1 1 auto;height:10px;background:#FFF3F5;border-radius:6px;overflow:hidden"><div style="${b.bar}"></div></div><span style="flex:0 0 38px;font-size:13px;font-weight:700;color:#B03A56;text-align:right">${b.pct}</span></div>`).join('')}
        <p style="margin:0;font-size:12px;color:#7A4A58">${esc(v.leafNote)}</p></section>
      <section class="card" style="gap:8px;padding:16px">${hd(2, 'From all studies to hers')}
        ${v.funnelLive.map((f) => `<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:600;color:#7A4A58">${esc(f.label)}</span><div style="display:flex;align-items:center;gap:8px"><div style="${f.bar}"></div><span style="font-size:15px;font-weight:700;color:#B03A56">${esc(f.n)}</span></div></div>`).join('')}</section>
    </div>
    ${v.ecgView ? `<section class="card" style="gap:8px;padding:16px">${hd(3, 'ECG AI, trained only on women')}
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px"><span style="font-size:14px;font-weight:700;color:#fff;background:${v.ecgView.isAF ? '#C2334F' : '#3F8F6B'};border-radius:999px;padding:3px 12px">${esc(v.ecgView.verdict)}</span><span style="font-size:12px;color:#7A4A58">Model accuracy on unseen women: 96% (AUROC)</span></div>
      ${ecgSvg(v.ecgView)}
      <p style="margin:0;font-size:13px;line-height:1.45">${esc(v.ecgView.detail)} <span style="color:#7A4A58">Dots are heartbeats; numbers are the milliseconds between them${v.ecgView.isAF ? ', red where they jump' : ''}.</span></p>
      <p style="margin:0;font-size:11px;color:#9C7380">${esc(v.ecgView.src)}</p></section>` : ''}
    <section class="card" style="gap:8px;padding:16px">${hd(v.ecgView ? 4 : 3, 'Sources')}
      ${v.noStudies ? '<p style="margin:0;font-size:14px">Tick one or more symptoms.</p>' : ''}
      ${v.top.map((t) => `<article style="border-top:1px solid #F7DCE2;padding-top:8px;display:flex;flex-direction:column;gap:4px"><a href="${t.url}" target="_blank" rel="noopener" style="font-size:14px;font-weight:600;line-height:1.35">[${t.n}] ${esc(t.t)}</a>${t.hasQuote ? `<p style="margin:0;font-size:12px;line-height:1.45;color:#7A4A58;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">“${esc(t.q)}”</p>` : ''}<div style="display:flex;flex-wrap:wrap;gap:4px"><span class="chip">${esc(t.y)}</span><span class="chip">${esc(t.g)}</span><span class="chip">${esc(t.m)}</span></div></article>`).join('')}</section>
  </div>`;
  return `<div class="w" style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">${left}${right}</div>`;
}
function draw() {
  H = [];
  const v = comp.renderVals();
  document.getElementById('app').innerHTML = `<div class="wrap">
  <header class="w" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;font-size:22px;letter-spacing:.18em;color:#8E2F47">ANARCHA</span><span style="font-weight:700;font-size:13px;color:#fff;background:#E65C6E;border-radius:999px;padding:3px 9px">AI</span></div>
    <span style="font-size:15px;font-weight:500;color:#7A4A58">How it works, in numbers</span>
  </header>
  <nav class="w" aria-label="Demo sections" style="display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;box-sizing:border-box;box-shadow:0 8px 24px rgba(142,47,71,.08)">
    <button type="button" ${on(v.showInfo)} aria-pressed="${v.infoPressed}" style="${v.infoTab}">Information</button>
    <button type="button" ${on(v.showHands)} aria-pressed="${v.handsPressed}" style="${v.handsTab}">Practical hands-on</button>
  </nav>
  ${v.isInfo ? info(v) : hands(v)}
  <p style="margin:0;font-size:14px;color:#7A4A58;text-align:center">Information, not a diagnosis. The doctor decides.</p>
  </div>`;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (b) H[+b.dataset.h](); });
document.addEventListener('change', (e) => { const b = e.target.closest('[data-c]'); if (b) H[+b.dataset.c](b.value); });
if (location.hash === '#hands-on') comp.state.tab = 'hands';
draw();
comp.componentDidMount();
</script>
