<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anarcha AI: how it works</title>
<meta name="description" content="How Anarcha AI turns women-only research into an answer a GP can use, in numbers, with a hands-on demo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23E65C6E'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>

body{margin:0;background:#FFF3F5;font-family:Poppins,system-ui,sans-serif;color:#5C2234}
a{color:#B03A56}a:hover{color:#8E2F47}

.chip{font-size:12px;font-weight:600;background:#FFE7EC;color:#8E2F47;border-radius:999px;padding:3px 9px}
</style>
</head>
<body>
<div id="app"></div>
<script>
class DCLogic { constructor(props) { this.props = props || {}; } setState(o) { Object.assign(this.state, o); draw(); } }
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'info', data: null, preset: 0, sel: { Fatigue: 1, Dyspnea: 1, Edema: 1, 'Jaw Pain': 1 }, ctx: {}, age: '45-64', ecg: true };
  }
  componentDidMount() {
    fetch('data/handson.json').then((r) => r.json()).then((data) => this.setState({ data })).catch(() => {});
  }
  hands() {
    const st = this.state, D = st.data;
    const PRESETS = [
      { name: 'Woman, 57', line: 'tired, breathless, swollen ankles, jaw ache', sel: ['Fatigue', 'Dyspnea', 'Edema', 'Jaw Pain'], ctx: {}, age: '45-64', ecg: true },
      { name: 'Woman, 34', line: 'pregnant, headache, blurred vision, swelling', sel: ['Headache', 'Visual Disturbances', 'Edema'], ctx: { Pregnancy: 1 }, age: '25-44', ecg: false },
      { name: 'Woman, 66', line: 'chest pain, sweating, feeling sick, arm pain', sel: ['Chest Pain', 'Sweating', 'Nausea', 'Arm Pain'], ctx: {}, age: '65+', ecg: true },
      { name: 'Woman, 51', line: 'menopause, racing heart, dizziness, anxiety', sel: ['Palpitations', 'Dizziness', 'Anxiety'], ctx: { Menopause: 1 }, age: '45-64', ecg: true }
    ];
    const pill = (on) => 'min-height: 40px; padding: 6px 12px; border-radius: 999px; font: 600 14px Poppins, system-ui, sans-serif; cursor: pointer; border: 1.5px solid ' + (on ? '#B03A56' : '#E7C3CB') + '; background: ' + (on ? '#B03A56' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#5C2234');
    const presets = PRESETS.map((p, i) => ({
      name: p.name, line: p.line, pressed: String(st.preset === i),
      style: 'text-align: left; min-height: 64px; padding: 10px 12px; border-radius: 16px; cursor: pointer; font-family: Poppins, system-ui, sans-serif; color: ' + (st.preset === i ? '#FFFFFF' : '#5C2234') + '; background: ' + (st.preset === i ? '#B03A56' : '#FFF3F5') + '; border: 1.5px solid ' + (st.preset === i ? '#B03A56' : '#F2C3CD'),
      pick: () => this.setState({ preset: i, sel: Object.fromEntries(p.sel.map((x) => [x, 1])), ctx: Object.assign({}, p.ctx), age: p.age, ecg: p.ecg })
    }));
    const syms = D ? D.symptoms : [];
    const chips = syms.map((s) => ({ plain: s.plain, pressed: String(!!st.sel[s.name]), style: pill(!!st.sel[s.name]),
      toggle: () => { const sel = Object.assign({}, st.sel); if (sel[s.name]) delete sel[s.name]; else sel[s.name] = 1; this.setState({ sel, preset: -1 }); } }));
    const CTX = [['Pregnancy', 'Pregnant'], ['Postpartum', 'Just gave birth'], ['Menopause', 'Menopause']];
    const ctxChips = CTX.map(([k, label]) => ({ label, pressed: String(!!st.ctx[k]), style: pill(!!st.ctx[k]),
      toggle: () => { const ctx = Object.assign({}, st.ctx); if (ctx[k]) delete ctx[k]; else ctx[k] = 1; this.setState({ ctx, preset: -1 }); } }));
    const AGES = ['under 25', '25-44', '45-64', '65+'];
    const ages = AGES.map((a) => ({ label: a === 'under 25' ? 'Under 25' : a, pressed: String(st.age === a), style: pill(st.age === a), pick: () => this.setState({ age: a, preset: -1 }) }));
    const base = { presets, chips, ctxChips, ages, ecg: st.ecg, ecgPressed: String(st.ecg), ecgBtn: pill(st.ecg) + '; align-self: flex-start', ecgLabel: st.ecg ? 'ECG attached' : 'Attach an ECG',
      toggleEcg: () => this.setState({ ecg: !st.ecg }), loading: !D, ready: !!D };
    if (!D) return Object.assign(base, { typed: '', recog: [], funnelLive: [], path: [], leafName: '', leafNote: '', leafBars: [], top: [], noStudies: true, answer: '', ecgPoints: '' });
    const chosen = syms.filter((s) => st.sel[s.name]);
    const feats = new Set(chosen.map((s) => s.name).concat(Object.keys(st.ctx)));
    if (st.age === 'under 25') feats.add('Age: adolescent or young adult');
    if (st.age === '45-64') feats.add('Age: middle-aged');
    if (st.age === '65+') feats.add('Age: 65 or older');
    Object.entries(D.merge || {}).forEach(([name, mem]) => { if (mem.some((m) => feats.has(m))) feats.add(name); });
    const PL = { 'Pregnancy': 'Pregnant', 'Postpartum': 'Just gave birth', 'Menopause': 'Menopause', 'Age: adolescent or young adult': 'Under 25', 'Age: middle-aged': 'Aged 45 to 64', 'Age: 65 or older': '65 or older', 'Design: randomised trial': 'Trial study', 'Design: cohort or observational': 'Follow-up study', 'Design: cross-sectional': 'Survey study', 'Pain spreading from the chest': 'Pain spreading from the chest', 'Muscle pain or weakness': 'Muscle pain or weakness', 'Pelvic Pain': 'Pelvic pain', 'Cyanosis': 'Bluish lips', 'Snoring': 'Snoring', 'Hirsutism': 'Extra hair growth', 'Urinary Incontinence': 'Leaking urine', 'Sleep Wake Disorders': 'Poor sleep', 'Myalgia': 'Aching muscles', 'Muscle Weakness': 'Weak muscles', 'Fever': 'Fever' };
    const plainOf = (f) => PL[f] || ((syms.find((s) => s.name === f) || {}).plain) || f;
    let n = D.tree; const path = [];
    while (!n.leaf) { const yes = feats.has(n.f); path.push({ q: plainOf(n.f) + '?', a: yes ? 'YES' : 'NO', ansStyle: 'font-size: 12px; font-weight: 700; color: #FFFFFF; border-radius: 999px; padding: 2px 7px; margin-left: 4px; background: ' + (yes ? '#B03A56' : '#B9A6AD') }); n = yes ? n.yes : n.no; }
    const leafTotal = n.groups.reduce((a, g) => a + g[1], 0) || 1;
    const leafBars = n.groups.map(([g, k]) => ({ name: g, pct: Math.round(100 * k / leafTotal) + '%', bar: 'height: 100%; border-radius: 7px; background: #E65C6E; width: ' + Math.round(100 * k / leafTotal) + '%' }));
    const hits = {};
    chosen.forEach((s) => s.ids.forEach((i) => { (hits[i] = hits[i] || []).push(s); }));
    const lead = n.groups[0][0];
    const ids = Object.keys(hits).map(Number).sort((a, b) => (hits[b].length - hits[a].length) || ((D.studies[b].g === lead) - (D.studies[a].g === lead)) || ((D.studies[b].y || 0) - (D.studies[a].y || 0)));
    const top = ids.slice(0, 5).map((i, k) => {
      const s = D.studies[i]; const q = hits[i].map((h) => D.quotes[i + '|' + h.name]).find(Boolean) || '';
      return { n: k + 1, t: s.t, y: String(s.y || ''), g: s.g, url: 'https://europepmc.org/article/PMC/' + s.id, q, hasQuote: !!q, m: 'matches: ' + hits[i].map((h) => h.plain.toLowerCase()).join(', ') };
    });
    const lm = Math.log10(50748), l0 = Math.log10(1);
    const bar = (v) => 'height: 18px; border-radius: 9px; background: #E65C6E; flex: 0 0 auto; width: ' + Math.max(2, Math.round(80 * (Math.log10(Math.max(v, 1)) - l0) / (lm - l0))) + '%';
    const funnelLive = [['Women-only studies', 50748], ['Heart and blood vessels', D.total_heart], ['Describe women\u2019s symptoms', D.with_symptoms], ['Match her symptoms', ids.length]]
      .map(([label, v]) => ({ label, n: v.toLocaleString('en-US'), bar: bar(v) }));
    const ageTxt = st.age === 'under 25' ? 'under 25' : 'aged ' + st.age.replace('-', ' to ');
    const ctxTxt = Object.keys(st.ctx).map((k) => plainOf(k).toLowerCase());
    const typed = 'Woman, ' + ageTxt + (ctxTxt.length ? ', ' + ctxTxt.join(', ') : '') + ': ' + (chosen.length ? chosen.map((s) => s.plain.toLowerCase()).join(', ') : 'no symptoms picked') + (st.ecg ? '. ECG attached.' : '.');
    const recog = chosen.map((s) => s.plain + ' \u2192 ' + s.name).concat(Object.keys(st.ctx).map(plainOf));
    const answer = chosen.length
      ? ids.length.toLocaleString('en-US') + ' women-only studies describe women with ' + chosen.map((s) => s.plain.toLowerCase()).join(', ') + '. The decision tree points to research on ' + lead.toLowerCase() + ' (' + leafBars[0].pct + ' of the most similar studies). Start with sources [1] to [3].' + (st.ecg ? ' Her ECG was checked by the women-only ECG AI.' : '')
      : 'Pick one or more symptoms to see the evidence.';
    const ecgPoints = (D.ecg || []).map((v, i) => i + ',' + (60 - v * 48).toFixed(1)).join(' ');
    return Object.assign(base, { typed, recog, funnelLive, path, leafName: lead, leafNote: 'Best-fit group of ' + n.papers + ' studies at the end of her path. Learned from 855 studies; right group in its top three 71% of the time.', leafBars, top, noStudies: !chosen.length, answer, ecgPoints });
  }
  renderVals() {
    const F = [
      ['Collected and checked', 50748, '50,748', 'Studies in which only women took part, from Europe PMC. In a hand check, about 9 in 10 were truly women-only.'],
      ['Heart and blood vessels', 5500, '≈ 5,500', 'Studies about the heart and blood vessels.'],
      ['Women’s symptoms described', 855, '855', 'Heart studies that describe the symptoms the women actually had.'],
      ['Match her symptoms', 280, '280', 'Studies of women who had tiredness, breathlessness, swollen ankles or jaw ache.'],
      ['Best-fit group', 40, '40', 'The decision tree points to a group of 40 studies, led by heart failure.']
    ];
    const lmax = Math.log10(50748), lmin = Math.log10(10);
    const funnel = F.map(([step, v, n, what]) => ({
      step, n, what,
      bar: 'height: 22px; border-radius: 11px; background: #E65C6E; flex: 0 0 auto; width: ' + Math.max(4, Math.round(100 * (Math.log10(v) - lmin) / (lmax - lmin) * 0.85)) + '%'
    }));
    const steps = [
      { tag: 'STEP 1 · THE DATA', title: 'Only studies of women', img: 'img/step3.jpg', alt: 'Studies pass a female filter and a women-only check',
        body: 'We keep studies labelled as about women and not men, then a program reads how each study describes its participants and saves the sentence that proves only women took part.',
        stats: [{ v: '50,748', l: 'women-only studies' }, { v: '9 in 10', l: 'confirmed in a hand check' }] },
      { tag: 'STEP 1 · THE DATA', title: 'Similar studies group into themes', img: 'img/step4.jpg', alt: 'A map of studies coloured by research theme',
        body: 'A computer turns every study into a fingerprint and places similar studies close together. It finds the research themes on its own.',
        stats: [{ v: '30', l: 'research themes' }, { v: '2', l: 'themes about the heart' }] },
      { tag: 'STEP 2 · SYMPTOM FILTER', title: 'Her words find the studies', img: 'img/step7.jpg', alt: 'Matching heart studies light up next to a small decision tree',
        body: 'Everyday words like “jaw ache” are matched to medical terms, and “no chest pain” does not count. A decision tree of yes-or-no questions then points to the best-fitting research.',
        stats: [{ v: '56', l: 'symptoms recognised' }, { v: '280', l: 'studies match her' }] },
      { tag: 'STEP 2 · ECG AI', title: 'An ECG model trained only on women', img: 'img/step2.jpg', alt: 'The GP types her symptoms and attaches her ECG',
        body: 'The GP can attach an ECG. Our model learned from women’s ECGs only and recognises six heart rhythm and conduction problems, such as atrial fibrillation.',
        stats: [{ v: '96%', l: 'accuracy (AUROC)' }, { v: '6', l: 'heart problems' }] },
      { tag: 'STEP 3 · REASONING AGENT', title: 'One answer, with sources', img: 'img/step8.jpg', alt: 'Studies, ECG and tree flow into the AI; an answer card with sources',
        body: 'The agent combines the studies, the ECG and the tree into a short answer. Every claim links to a study and a sentence. It never diagnoses.',
        stats: [{ v: '3', l: 'inputs: studies, ECG, tree' }, { v: '[1] [2] [3]', l: 'every claim has a source' }] },
      { tag: 'THE RESULT', title: 'Referred straight away', img: 'img/step9.jpg', alt: 'She walks on to a cardiologist, with a green check',
        body: 'Instead of being sent home, the patient in our example goes straight to a cardiologist. The doctor decides, with women’s research at hand.',
        stats: [{ v: '< 1 s', l: 'to an answer in our prototype' }, { v: '40', l: 'studies in her best-fit group' }] }
    ];
    const bar = (v, c) => 'height: 100%; border-radius: 9px; background: ' + c + '; width: ' + v + '%';
    const T = [
      ['Correct symptoms found in study summaries', 84, 80, 'Comparison: PubTator, a leading public tool. 1,309 study summaries.'],
      ['Share of symptoms found at all', 89, 42, 'Comparison: PubTator.'],
      ['Useful studies in the top 10, for 20 new GP questions', 37, 17, 'Comparison: a standard search.'],
      ['Decision tree: right group in its top three', 71, 16, 'Comparison: picking by chance. Tested on studies it had not seen.'],
      ['ECG AI on women it had not seen', 96, 50, 'AUROC; comparison: guessing (50). Average over the heart problems, from the latest training round.']
    ];
    const tests = T.map(([name, a, b, note]) => ({ name, note, a: a + '%', b: b + '%', ours: bar(a, '#B03A56'), base: bar(b, '#CDB7BD') }));
    const tabStyle = (on) => 'flex: 1 1 0; min-height: 46px; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap; font: 600 clamp(13px, 3.8vw, 16px) Poppins, system-ui, sans-serif; background: ' + (on ? '#B03A56' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#8E2F47');
    const isInfo = this.state.tab === 'info';
    return Object.assign({ funnel, steps, tests, isInfo, isHands: !isInfo, infoPressed: String(isInfo), handsPressed: String(!isInfo),
      infoTab: tabStyle(isInfo), handsTab: tabStyle(!isInfo), showInfo: () => this.setState({ tab: 'info' }), showHands: () => this.setState({ tab: 'hands' }) }, this.hands());
  }
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let H = [];
const on = (fn) => { H.push(fn); return 'data-h="' + (H.length - 1) + '"'; };
const comp = new Component({});
function info(v) {
  return `
  <section class="w" style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
    <h1 style="margin:0;font-size:clamp(30px,4.4vw,52px);line-height:1.1;font-weight:700">From 50,748 studies to one answer</h1>
    <p style="margin:0;max-width:720px;font-size:18px;line-height:1.55">Every number below comes from our own data and tests. The example patient: a woman of 57, tired, breathless, swollen ankles and a sore jaw.</p>

  <section class="w card" aria-label="The process as a funnel" style="border-radius:28px;padding:28px;gap:14px">

  </section>
  <section class="w" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px">
    ${v.steps.map((s) => `<article style="background:#fff;border-radius:24px;box-shadow:0 12px 34px rgba(142,47,71,.09);overflow:hidden;display:flex;flex-direction:column">
      <img src="${s.img}" alt="${esc(s.alt)}" loading="lazy" style="width:100%;aspect-ratio:1440/683;object-fit:cover;background:#FFE7EC;display:block">
      <div style="padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px">

      </div></article>`).join('')}
  </section>
  <section class="w card" aria-label="Test results" style="border-radius:28px;padding:28px;gap:18px">
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
      <h2 style="margin:0;font-size:24px;font-weight:700">How well it works</h2>
      <div style="display:flex;gap:16px;font-size:14px"><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:4px;background:#B03A56"></span>Anarcha AI</span><span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:4px;background:#CDB7BD"></span>Comparison</span></div>

function hands(v) {

    <button type="button" ${on(v.toggleEcg)} aria-pressed="${v.ecgPressed}" style="${v.ecgBtn}">${esc(v.ecgLabel)}</button>

  if (v.loading) return `<div class="w" style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">${left}<div class="card" style="flex:999 1 560px"><p style="margin:0">Loading the evidence…</p></div></div>`;
  const right = `<div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
    <section class="card"><div style="display:flex;align-items:center;gap:10px"><span class="num">1</span><h3 class="h">What the GP typed</h3></div>
      <p style="margin:0;font-size:17px;line-height:1.5;background:#FFF3F5;border-radius:14px;padding:12px 16px">${esc(v.typed)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${v.recog.map((r) => `<span class="chip" style="font-size:13px;padding:4px 10px">${esc(r)}</span>`).join('')}</div></section>
    <section class="card"><div style="display:flex;align-items:center;gap:10px"><span class="num">2</span><h3 class="h">From all studies to hers</h3></div>
      ${v.funnelLive.map((f) => `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px"><span style="flex:0 0 200px;font-size:14px;font-weight:600;color:#7A4A58">${esc(f.label)}</span><div style="flex:999 1 260px;display:flex;align-items:center;gap:10px;min-width:0"><div style="${f.bar}"></div><span style="font-size:20px;font-weight:700;color:#B03A56;white-space:nowrap">${esc(f.n)}</span></div></div>`).join('')}</section>
    <section class="card"><div style="display:flex;align-items:center;gap:10px"><span class="num">3</span><h3 class="h">The decision tree, live</h3></div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">${v.path.map((q) => `<div style="display:flex;align-items:center;gap:8px"><span style="font-size:15px;font-weight:600;border:2px solid #E65C6E;border-radius:12px;padding:6px 10px">${esc(q.q)} <span style="${q.ansStyle}">${q.a}</span></span><span aria-hidden="true" style="color:#E65C6E;font-weight:700">→</span></div>`).join('')}<span style="font-size:15px;font-weight:700;color:#fff;background:#B03A56;border-radius:12px;padding:8px 12px">${esc(v.leafName)}</span></div>
      <p style="margin:0;font-size:14px;color:#7A4A58">${esc(v.leafNote)}</p>
      ${v.leafBars.map((b) => `<div style="display:flex;align-items:center;gap:10px"><span style="flex:0 1 230px;font-size:14px">${esc(b.name)}</span><div style="flex:1 1 auto;height:14px;background:#FFF3F5;border-radius:7px;overflow:hidden"><div style="${b.bar}"></div></div><span style="flex:0 0 48px;font-size:15px;font-weight:700;color:#B03A56;text-align:right">${b.pct}</span></div>`).join('')}</section>
    ${v.ecg ? `<section class="card"><div style="display:flex;align-items:center;gap:10px"><span class="num">4</span><h3 class="h">ECG AI, trained only on women</h3></div>
      <svg viewBox="0 0 1024 120" role="img" aria-label="Example ECG trace" style="width:100%;height:auto;background:#FFF3F5;border-radius:12px"><polyline points="${v.ecgPoints}" fill="none" stroke="#E65C6E" stroke-width="2.4" stroke-linejoin="round"></polyline></svg>
      <p style="margin:0;font-size:15px;line-height:1.5">The ECG is checked for six heart rhythm and conduction problems, such as atrial fibrillation. On women it had not seen, the model scores <b style="color:#B03A56">96%</b> (AUROC). Example trace from the open CODE-15% data.</p></section>` : ''}
    <section class="card"><div style="display:flex;align-items:center;gap:10px"><span class="num">5</span><h3 class="h">The best-matching studies</h3></div>
      ${v.noStudies ? '<p style="margin:0;font-size:15px">Pick one or more symptoms.</p>' : ''}
      ${v.top.map((t) => `<article style="border-top:1px solid #F2C3CD;padding-top:12px;display:flex;flex-direction:column;gap:6px"><a href="${t.url}" target="_blank" rel="noopener" style="font-size:16px;font-weight:600;line-height:1.35">[${t.n}] ${esc(t.t)}</a>${t.hasQuote ? `<p style="margin:0;font-size:14px;line-height:1.5;background:#FFF3F5;border-radius:10px;padding:8px 12px">“${esc(t.q)}”</p>` : ''}<div style="display:flex;flex-wrap:wrap;gap:6px"><span class="chip">${esc(t.y)}</span><span class="chip">${esc(t.g)}</span><span class="chip">${esc(t.m)}</span></div></article>`).join('')}</section>
    <section class="card" style="background:#8E2F47;color:#fff"><div style="display:flex;align-items:center;gap:10px"><span class="num" style="background:#fff;color:#8E2F47">6</span><h3 class="h" style="color:#fff">The agent's answer</h3></div>
      <p style="margin:0;font-size:17px;line-height:1.6">${esc(v.answer)}</p><p style="margin:0;font-size:14px;color:#FFD6DE">Research information, not a diagnosis. The doctor decides.</p></section>
  </div>`;
  return `<div class="w" style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">${left}${right}</div>`;
}
function draw() {
  H = [];
  const v = comp.renderVals();
  document.getElementById('app').innerHTML = `<div class="wrap">
  <header class="w" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;font-size:22px;letter-spacing:.18em;color:#8E2F47">ANARCHA</span><span style="font-weight:700;font-size:13px;color:#fff;background:#E65C6E;border-radius:999px;padding:3px 9px">AI</span></div>
    <span style="font-size:15px;font-weight:500;color:#7A4A58">How it works, in numbers</span>
  </header>
  <nav class="w" aria-label="Demo sections" style="display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;box-sizing:border-box;box-shadow:0 8px 24px rgba(142,47,71,.08)">
    <button type="button" ${on(v.showInfo)} aria-pressed="${v.infoPressed}" style="${v.infoTab}">Information</button>
    <button type="button" ${on(v.showHands)} aria-pressed="${v.handsPressed}" style="${v.handsTab}">Practical hands-on</button>
  </nav>
  ${v.isInfo ? info(v) : hands(v)}
  <p style="margin:0;font-size:14px;color:#7A4A58;text-align:center">Information, not a diagnosis. The doctor decides.</p>
  </div>`;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (b) H[+b.dataset.h](); });
if (location.hash === '#hands-on') comp.state.tab = 'hands';
draw();
comp.componentDidMount();
</script>
</body>
</html>
